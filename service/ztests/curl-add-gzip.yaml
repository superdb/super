script: |
  source service.sh
  curl -X POST -d '{"name":"test","sortkeys":[{"order":"desc","path":["ts"]}]}' $SUPER_DB/pool > pool.json
  poolID=$(super -f line -c "values uuid(pool.id)" pool.json)
  curl -X POST --data-binary @- $SUPER_DB/pool/$poolID/branch/main | super -s -c "commit:=0" -

inputs:
  - name: stdin
    # Generated with `bash -c 'gzip -c <<<{x:1} | base64'`.
    data: !!binary |
      H4sIAMaiGmEAA6uusDKs5QIAaI7+2QYAAAA=
  - name: service.sh
    source: service.sh

outputs:
  - name: stdout
    data: |
      {commit:0,warnings:[]::[string]}
