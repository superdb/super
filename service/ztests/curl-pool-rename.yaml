script: |
  source service.sh
  curl -X POST \
    -H "Accept: application/json" \
    -d '{"name": "test", "layout": { "order": "desc", "keys": [["ts"]] }}' \
    $DB_URL/table > /dev/null
  curl -X PUT \
    -H "Accept: application/json" \
    -d '{"name":"new_test"}' \
    $DB_URL/table/test
  curl -X POST \
    -H "Accept: application/json" \
    -d '{"query":"from :tables"}' \
    $DB_URL/query | super -S -c "values this[0] | id:=0,ts:=0" -

inputs:
  - name: service.sh

outputs:
  - name: stdout
    data: |
      {
        ts: 0,
        name: "new_test",
        id: 0,
        sortkeys: [],
        objectcap: 1048576,
        framecap: 20000,
        type: "0x",
        sql: false
      }
