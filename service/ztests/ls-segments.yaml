script: |
  source service.sh
  super db create -q test
  super db load -q -use test 1.sup
  super db load -q -use test 2.sup
  super db -f db -c "from test@main:objects"

inputs:
  - name: service.sh
    source: service.sh
  - name: 1.sup
    data: |
      {x:1}
  - name: 2.sup
    data: |
      {x:2}

outputs:
  - name: stdout
    regexp: |
      [0-9a-f-]{36} \d+B bytes 1 records
         min none max none
      [0-9a-f-]{36} \d+B bytes 1 records
         min none max none
