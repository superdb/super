script: |
  source service.sh
  curl -X POST -d '{"name":"test","sort_keys":[{"order":"desc","path":["ts"]}]}' $DB_URL/table > table.sup
  tableID=$(super -f line -c 'values table.id' table.sup)
  curl -X POST -d @- $DB_URL/table/$tableID/branch/main > load.sup
  curl $DB_URL/table/$tableID/stats

inputs:
  - name: stdin
    source: ../../testdata/babble.sup
  - name: service.sh

outputs:
  - name: stdout
    data: |
      type "nano.Duration"=int64
      type "nano.Span"={ts:timestamp,dur:"nano.Duration"}
      type "exec.TableStats"={size:int64,span:"nano.Span"}
      {size:27822,span:{ts:2020-04-21T22:40:30.06852324Z,dur:9789993714061}}::exec.TableStats
