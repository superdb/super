script: |
  source service.sh
  curl -X POST \
    -H "Accept: application/json" \
    -d '{"name": "test", "layout": { "order": "desc", "keys": [["ts"]] }}' \
    $DB_URL/table | super -S -c "table.ts:=0,table.id:=0,branch.ts:=0" -

inputs:
  - name: service.sh
    source: service.sh

outputs:
  - name: stdout
    data: |
      {
        table: {
          ts: 0,
          name: "test",
          id: 0,
          sortkeys: [],
          objectcap: 1048576,
          framecap: 20000,
          type: "0x",
          sql: false
        },
        branch: {
          ts: 0,
          name: "main",
          commit: "00000000-0000-0000-0000-000000000000"
        }
      }
