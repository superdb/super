script: |
  source service.sh
  curl -X POST \
    -H "Accept: application/json" \
    -d '{"name": "test", "layout": { "order": "desc", "keys": [["ts"]] }}' \
    $SUPER_DB/pool | super -S -c "pool.ts:=0,pool.id:=0,branch.ts:=0" -

inputs:
  - name: service.sh
    source: service.sh

outputs:
  - name: stdout
    data: |
      {
        pool: {
          ts: 0,
          name: "test",
          id: 0,
          sortkeys: [],
          objectcap: 1048576,
          framecap: 20000
        },
        branch: {
          ts: 0,
          name: "main",
          commit: "0x00000000000000000000000000000000"
        }
      }
