script: |
  source service.sh
  super db create -use -q test
  super db load -user testuser -q 1.sup
  super db load -user testuser -q 2.sup
  super db log

inputs:
  - name: service.sh
    source: service.sh
  - name: 1.sup
    data: |
      {x:1}
  - name: 2.sup
    data: |
      {x:2}

outputs:
  - name: stdout
    regexp: |
      commit \w{27} \(HEAD -> main\)
      Author: testuser
      Date:   [0-9TZ:\-]+

          loaded 1 data object

          \w{27} 1 value in 635 data bytes

      commit \w{27}
      Author: testuser
      Date:   [0-9TZ:\-]+

          loaded 1 data object

          \w{27} 1 value in 635 data bytes
