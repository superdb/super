spq: pass

flags: -i sup

input: |
  type foo=missing
  {a?:none::option(foo)}

error: |
  stdio:stdin: option some type cannot be type missing

---

spq: pass

flags: -i sup

input: |
  type foo=missing
  {a:none::foo}

error: |
  stdio:stdin: none::missing assigned to field a

---

spq: pass

input: &input |
  type foo=missing
  none::foo

output: *input

---

spq: values this ?? none::bar

input: |
  type foo=missing
  type bar=foo
  none::foo

output: |
  type foo=missing
  type bar=foo
  none::bar
