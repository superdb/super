spq: pass

flags: -i sup

input: |
  type foo=none
  {a?:none::option(foo)}

error: |
  stdio:stdin: option some type cannot be type none

---

spq: pass

flags: -i sup

input: &input |
  type foo=none
  {a:none::foo}

output: *input

---

spq: values this ?? none::bar

input: |
  type foo=none
  type bar=foo
  none::foo

output: |
  type foo=none
  type bar=foo
  none::bar
