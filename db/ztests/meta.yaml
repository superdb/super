script: |
  super db init -q test
  super db attach -q test
  super db create -q -orderby a:asc tableA
  super db create -q -orderby b:desc tableB
  super db load -q -use tableA a.sup
  super db load -q -use tableB b.sup
  super db -S -c 'from :tables | drop id | sort name | drop ts'
  echo ===
  super db -fusion -S -c 'from tableA@main:objects | {nameof:nameof(this),...this} | drop id'
  super db -S -c 'from tableA:log | cut nameof(this)'

inputs:
  - name: a.sup
    data: |
      {a:1}
      {a:2}
  - name: b.sup
    data: |
      {b:3}
      {b:2}
      {b:1}

outputs:
  - name: stdout
    data: |
      type "order.Which" = string
      type "field.Path" = [string]
      type "order.SortKey" = {
        order: "order.Which",
        path: "field.Path"
      }
      type "order.SortKeys" = ["order.SortKey"]
      {
        name: "tableA",
        sortkeys: [
          {
            order: "asc",
            path: [
              "a"
            ]
          }
        ]::order.SortKeys,
        objectcap: 1048576::uint64,
        framecap: 20000::uint64,
        type: 0x,
        sql: false
      }
      {
        name: "tableB",
        sortkeys: [
          {
            order: "desc",
            path: [
              "b"
            ]
          }
        ]::order.SortKeys,
        objectcap: 1048576::uint64,
        framecap: 20000::uint64,
        type: 0x,
        sql: false
      }
      ===
      {
        nameof: "data.Object",
        type: <{
          a: int64
        }>,
        min: 1,
        max: 2,
        count: 2::uint64,
        size: 615
      }
      {
        nameof: "db.BranchTip"
      }
      {
        nameof: "Commit"
      }
