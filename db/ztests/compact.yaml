script: |
  export SUPER_DB=test
  super db init -q
  super db create -use -q test
  seq 10 | super -c '{ts:this-1,s:f"val{this-1}"}' - | super db load -q -
  seq 10 | super -c '{ts:this-1,s:f"val{this-1}"}' - | super db load -q -
  ids=$(super db -f line -c 'from test@main:objects | values f"0x{hex(id)}"')
  super db compact -q $ids
  super db -f db -c 'from test@main:objects'

outputs:
  - name: stdout
    regexp: |
      [0-9a-f-]{36} 123B bytes 20 records
         min 0 max 9
