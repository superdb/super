script: |
  export SUPER_DB=test
  super db init -q
  super db create -use -q test
  echo {x:1} | super db load -message 'commit1' -q -
  echo {x:2} | super db load -message 'commit2' -q -
  echo {x:3} | super db load -message 'commit3' -q -
  echo {x:4} | super db load -message 'commit4' -q -
  super db vacate -dryrun
  echo // ===
  super db vacate -f
  echo // === 
  super db -s -c 'from test:log | message.is_ok() | values message'
  echo // === 
  super db -s -c 'from test'
  ! super db vacate -f
  echo {x:5} | super db load -message 'commit5' -q -
  echo // ===
  super db vacate -f
  echo // === 
  super db -s -c 'from test:log | message.is_ok() | values message'

outputs:
  - name: stdout
    data: |
      would vacate 3 commits
      // ===
      vacated 3 commits
      // ===
      "commit4"
      // ===
      {x:1}
      {x:2}
      {x:3}
      {x:4}
      // ===
      vacated 1 commit
      // ===
      "commit5"
  - name: stderr
    data: |
      cannot set base on earliest commit

---

# Test that vacate fails if a branch does not include the new base commit.
script: |
  export SUPER_DB=test
  super db init -q
  super db create -use -q test
  echo {x:1} | super db load -q -
  super db branch -q branch1
  super db branch -q branch2
  echo {x:1} | super db load -q -use test@branch1 -
  echo {x:1} | super db load -q -use test@branch2 -
  echo {x:2} | super db load -q -
  ! super db vacate -f

outputs:
  - name: stderr
    data: |
      cannot vacate at selected time: branches do not include commit nearest timestamp in the deletion path: branch1, branch2
