script: |
  super db init -q test
  super db attach -q test
  super db create -q logs
  super db load -q -use logs -meta '"original"' babble.sup
  super db load -q -use logs -meta '"normalized-v1"' babble.sup
  super db load -q -use logs -meta '"normalized-v2"' babble.sup
  super db -s -c "from logs@main:log | meta:=superdefuse(meta) | grep('normalized.*', meta) | sort date | cut meta"

inputs:
  - name: babble.sup
    source: ../../testdata/babble.sup

outputs:
  - name: stdout
    data: |
      {meta:"normalized-v1"}
      {meta:"normalized-v2"}
