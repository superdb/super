script: |
  source s3.sh
  aws s3api create-bucket --bucket bucket
  super db init -q s3://bucket/db
  super db attach -q s3://bucket/db
  super db create -q -orderby ts:desc logs
  super db load -q -use logs babble.sup
  super db -S -c "from logs@main:objects | drop id | min:=superdefuse(min),max:=superdefuse(max)"

inputs:
  - name: babble.sup
    source: ../../../testdata/babble.sup
  - name: s3.sh
    source: ../../../testdata/s3.sh

outputs:
  - name: stdout
    data: |
      {
        type: <{
          ts: timestamp,
          s: string,
          v: int64
        }>,
        min: 2020-04-21T22:40:30.06852324Z,
        max: 2020-04-22T01:23:40.0622373Z,
        count: 1000::uint64,
        size: 28535
      }
