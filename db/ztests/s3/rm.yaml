skip: issue 2540... need to delete by key range

script: |
  mkdir logs
  source s3.sh
  aws s3api create-bucket --bucket bucket
  super db import -R logs -data s3://bucket/db babble.sup
  super db map -R logs -o count.bsup "count()"
  echo ===
  super db ls -R logs -ranges -l
  echo ===
  super db rm -R logs -ranges count.bsup
  echo ===
  super db rm -R logs -ranges count.bsup

inputs:
  - name: babble.sup
    source: ../../../testdata/babble.sup
  - name: s3.sh
    source: ../../../testdata/s3.sh

