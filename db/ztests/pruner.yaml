# This test makes sure the type context from metadata processing doesn't
# leak into the flowgraph, except for metaqueries, where it should.
script: |
  super db init -q test
  super db attach -q test
  super db create -q -orderby k:asc tmp
  super db use -q tmp
  seq 10 15 | super -c '{k:this}' - | super db load -q -
  seq 8 12 | super -c '{k:this}' - | super db load -q -
  seq 20 25 | super -c '{k:this}' - | super db load -q -
  seq 14 16 | super -c '{k:this}' - | super db load -q -
  super db -c "from tmp:objects (tap true) | k > 18" | super -s -c "drop id | min:=superdefuse(min),max:=superdefuse(max)" -
  echo ===
  super db -c "from tmp:objects (tap true) | k <= 10" | super -s -c "drop id | min:=superdefuse(min),max:=superdefuse(max)" -
  echo ===
  super db -c "from tmp:objects (tap true) | k >= 15 and k < 20" | super -s -c "drop id | min:=superdefuse(min),max:=superdefuse(max)" -
  echo ===
  super db -c "from tmp:objects (tap true) | k <= 9 or k > 24" | super -s -c "drop id | min:=superdefuse(min),max:=superdefuse(max)" -
  echo ===
  super db -c 'from tmp:objects (tap true) | a[k] == "foo" or k >= 20' | super -s -c "drop id | min:=superdefuse(min),max:=superdefuse(max)" -
  echo ===
  super db -c 'from tmp:objects (tap true) | a[k] == "foo" and k >= 20' | super -s -c "drop id | min:=superdefuse(min),max:=superdefuse(max)" -

outputs:
  - name: stdout
    data: |
      {type:<{k:int64}>,min:20,max:25,count:6::uint64,size:615}
      ===
      {type:<{k:int64}>,min:8,max:12,count:5::uint64,size:615}
      {type:<{k:int64}>,min:10,max:15,count:6::uint64,size:615}
      ===
      {type:<{k:int64}>,min:10,max:15,count:6::uint64,size:615}
      {type:<{k:int64}>,min:14,max:16,count:3::uint64,size:615}
      ===
      {type:<{k:int64}>,min:8,max:12,count:5::uint64,size:615}
      {type:<{k:int64}>,min:20,max:25,count:6::uint64,size:615}
      ===
      {type:<{k:int64}>,min:8,max:12,count:5::uint64,size:615}
      {type:<{k:int64}>,min:10,max:15,count:6::uint64,size:615}
      {type:<{k:int64}>,min:14,max:16,count:3::uint64,size:615}
      {type:<{k:int64}>,min:20,max:25,count:6::uint64,size:615}
      ===
      {type:<{k:int64}>,min:20,max:25,count:6::uint64,size:615}
