script: |
  export SUPER_DB=test
  super db init -q
  super db create -q p1
  super db create -q p2
  super db rename p2 p3
  echo ===
  super db ls | sort
  echo ===
  super db drop -f p1
  echo ===
  ! super db rename p1 p4
  ! super db rename p2 p4

outputs:
  - name: stdout
    regexp: |
      pool [0-9a-f-]{36} renamed from p2 to p3
      ===
      p1 [0-9a-f-]{36} key ts order desc
      p3 [0-9a-f-]{36} key ts order desc
      ===
      pool deleted: p1
      ===
  - name: stderr
    data: |
      p1: pool not found
      p2: pool not found
