script: |
  export SUPER_DB=test
  super db init -q
  super db create -use -q test
  super db load -q -user testuser 1.sup
  super db load -q -user testuser 2.sup
  super db log

inputs:
  - name: 1.sup
    data: |
      {x:1}
  - name: 2.sup
    data: |
      {x:2}

outputs:
  - name: stdout
    regexp: |
      commit [0-9a-f-]{36} \(HEAD -> main\)
      Author: testuser
      Date:   [0-9TZ:\-]+

          loaded 1 data object

          [0-9a-f-]{36} 1 value in 635 data bytes

      commit [0-9a-f-]{36}
      Author: testuser
      Date:   [0-9TZ:\-]+

          loaded 1 data object

          [0-9a-f-]{36} 1 value in 635 data bytes
