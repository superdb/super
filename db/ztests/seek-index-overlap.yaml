script: |
  export SUPER_DB=test
  super db init -q
  super db create -orderby ts:asc -q asc
  super db create -orderby ts:desc -q desc
  super db use -q asc
  super -c "tail 900" babble.sup | super db load -q -
  super -c "head 250" babble.sup | super db load -q -
  super db -s -stats -c "from asc | count:=count()"
  echo === | tee /dev/stderr
  super db use -q desc
  super -c "tail 900" babble.sup | super db load -q -
  super -c "head 250" babble.sup | super db load -q -
  super db -s -stats -c "from desc | count:=count()"

inputs:
  - name: babble.sup
    source: ../../testdata/babble.sup

outputs:
  - name: stdout
    data: |
      {count:1150}
      ===
      {count:1150}
  - name: stderr
    data: |
      {bytes_read:33499,bytes_matched:33499,records_read:1150,records_matched:1150}
      ===
      {bytes_read:35630,bytes_matched:35630,records_read:1150,records_matched:1150}
