script: |
  export SUPER_DB=test
  super db init -q
  super db create -orderby ts:asc -q asc
  super db create -orderby ts:desc -q desc
  super db use -q asc
  super -c "tail 900" babble.sup | super db load -q -
  super -c "head 250" babble.sup | super db load -q -
  super db -s -stats -c "from asc | count:=count()"
  echo === | tee /dev/stderr
  super db use -q desc
  super -c "tail 900" babble.sup | super db load -q -
  super -c "head 250" babble.sup | super db load -q -
  super db -s -stats -c "from desc | count:=count()"

inputs:
  - name: babble.sup
    source: ../../testdata/babble.sup

outputs:
  - name: stdout
    data: |
      {count:1150}
      ===
      {count:1150}
  - name: stderr
    data: |
      {bytes_scanned:33499,values_scanned:1150,frames_scanned:2,frames_skipped_search_filter:0,frames_skipped_meta_filter:0,frames_skipped_data_filter:0,values_skipped_data_filter:0,meta_bytes_loaded:1915,data_bytes_loaded:31476,type_bytes_loaded:0}
      ===
      {bytes_scanned:35630,values_scanned:1150,frames_scanned:2,frames_skipped_search_filter:0,frames_skipped_meta_filter:0,frames_skipped_data_filter:0,values_skipped_data_filter:0,meta_bytes_loaded:1915,data_bytes_loaded:33607,type_bytes_loaded:0}
