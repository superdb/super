script: |
  super db init -q test
  super db attach -q test
  super db create -orderby ts:asc -q asc
  super db create -orderby ts:desc -q desc
  super db use -q asc
  super -c "tail 900" babble.sup | super db load -q -
  super -c "head 250" babble.sup | super db load -q -
  super db -s -stats -c "from asc | count:=count()"
  echo === | tee /dev/stderr
  super db use -q desc
  super -c "tail 900" babble.sup | super db load -q -
  super -c "head 250" babble.sup | super db load -q -
  super db -s -stats -c "from desc | count:=count()"

inputs:
  - name: babble.sup
    source: ../../testdata/babble.sup

outputs:
  - name: stdout
    data: |
      {count:1150}
      ===
      {count:1150}
  - name: stderr
    data: |
      {bytes_scanned:31677,values_scanned:1150,frames_scanned:2,frames_skipped_search_filter:0,frames_skipped_meta_filter:0,frames_skipped_data_filter:0,values_skipped_data_filter:0,meta_bytes_loaded:89,data_bytes_loaded:31476,type_bytes_loaded:28}
      ===
      {bytes_scanned:33808,values_scanned:1150,frames_scanned:2,frames_skipped_search_filter:0,frames_skipped_meta_filter:0,frames_skipped_data_filter:0,values_skipped_data_filter:0,meta_bytes_loaded:89,data_bytes_loaded:33607,type_bytes_loaded:28}
