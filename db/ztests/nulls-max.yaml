# This test ensures that nulls are the max value for either descending or 
# ascending ordered tables.

script: |
  super db init -q test
  super db attach -q test
  for o in asc desc; do
    echo "// $o"
    super db create -q -use -orderby ts:$o $o
    echo '{ts:150} {ts:null}' | super db load -q -
    echo '{ts:1}' | super db load -q -
    super db -s -c "from $o:objects | drop id, size | min:=superdefuse(min),max:=superdefuse(max)"
    echo "// ==="
    super db -s -c "from $o | head 1"
  done

outputs:
  - name: "stdout"
    data: |
      // asc
      {type:<{ts:int64}>,min:1,max:1,count:1::uint64}
      {type:<{ts:fusion(int64|null)}>,min:150,max:null,count:2::uint64}
      // ===
      {ts:1}
      // desc
      {type:<{ts:fusion(int64|null)}>,min:150,max:null,count:2::uint64}
      {type:<{ts:int64}>,min:1,max:1,count:1::uint64}
      // ===
      {ts:null}
