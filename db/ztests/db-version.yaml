script: |
  super db init -q test
  super db attach -q test
  super db create -q test
  mv test/superdb.bsup superdb-orig.bsup
  super -o test/superdb.bsup -c 'version:=1' superdb-orig.bsup
  ! super db serve test

outputs:
  - name: stderr
    data: |
      unsupported database version: found version 1 while expecting 7
