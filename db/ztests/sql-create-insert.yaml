# CREATE TABLE, INSERT INTO, and DROP TABLE statements in a script.
script: |
  super db init -q test
  super db attach -q test
  super db -s -c "
  type port = uint16
  create table conns (src ip not null, dport port, note varchar(20)) order by src desc;
  insert into conns values (10.0.0.1, 80, 'web'), (10.0.0.2, 443);
  insert into conns (note, src) values ('note', 10.0.0.3);
  insert into conns select '10.0.0.4' as s, 22 as p;
  select * from conns order by src;
  create table if not exists conns (x int);
  create table u (a int64|string, b int64|string not null);
  insert into u values {a:1,b:'x'}, {a:'y',b:2}, {b:3};
  from u | sort b;
  create super table of_t {a:int64}|string;
  insert into of_t values {a:1}, 'hi';
  from of_t | sort this;
  create table any_t;
  insert into any_t values (1, 'a');
  insert into any_t (x, y) values (2, 'b');
  from any_t | sort this;
  drop table any_t;
  drop table if exists any_t
  " | super -s -c "drop start,end,info.id,info.commit" -
  echo ===
  super db ls | awk '{$2=""; print}'

outputs:
  - name: stdout
    data: |
