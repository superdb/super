      {kind:"insert",stmt:"insert into conns (note, src) values ('note', 10.0.0.3)",info:{table:"conns",values:1::uint64},error:null}
      {kind:"insert",stmt:"insert into conns select '10.0.0.4' as s, 22 as p",info:{table:"conns",values:1::uint64},error:null}
      type port=uint16
      {src:10.0.0.1,dport:80::port,note:"web"}
      {src:10.0.0.2,dport:443::port,note:null}
      {src:10.0.0.3,dport:null,note:"note"}
      {src:10.0.0.4,dport:22::port,note:null}
      {kind:"query",stmt:"select * from conns order by src",info:{values:4::uint64},error:null}
      {kind:"create_table",stmt:"create table if not exists conns (x int)",info:{table:"conns",created:false},error:null}
      {kind:"create_table",stmt:"create table u (a int64|string, b int64|string not null)",info:{table:"u",created:true},error:null}
      {kind:"insert",stmt:"insert into u values {a:1,b:'x'}, {a:'y',b:2}, {b:3}",info:{table:"u",values:3::uint64},error:null}
      {a:"y"::(int64|string),b:2::(int64|string)}
      {a:null,b:3::(int64|string)}
      {a:1::(int64|string),b:"x"::(int64|string)}
      {kind:"query",stmt:"from u | sort b",info:{values:3::uint64},error:null}
      {kind:"create_table",stmt:"create super table of_t {a:int64}|string",info:{table:"of_t",created:true},error:null}
      {kind:"insert",stmt:"insert into of_t values {a:1}, 'hi'",info:{table:"of_t",values:2::uint64},error:null}
      "hi"::(string|{a:int64})
      {a:1}::(string|{a:int64})
      {kind:"query",stmt:"from of_t | sort this",info:{values:2::uint64},error:null}
      {kind:"create_table",stmt:"create table any_t",info:{table:"any_t",created:true},error:null}
