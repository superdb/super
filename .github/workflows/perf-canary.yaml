name: "Perf canary"

# Compares the performance of two builds of super on the small ghasample
# data set.  See perf/canary/README.md.
#
# * On a pull request, it compares the PR (merged into main) with the tip of
#   main, skipping the slow super-json-static tests so it finishes in about
#   the same time as the other CI.
# * On a push to main, it compares the new tip of main with the previous one,
#   including all tests.
# * It can also be run manually to compare any two commits.
#
# Significant changes never fail the job.  Instead, the results are reported
# in a separate "Perf canary results" check, which fails (red) if anything
# regressed, failed, or changed its output and is successful (green)
# otherwise, with the details in the check and the job summary.

on:
  pull_request:
    paths-ignore:
      - "book/**"
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "book/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      base:
        description: "Base commit or ref (default: merge-base of the target with main)"
      target:
        description: "Target commit or ref (default: the branch selected above)"
      runs:
        description: "Measured runs per query for each build"
        default: "5"
      systems:
        description: "Comma-separated systems to test (default: all of super-bsup, super-json, super-json-static, super-parquet)"
      queries:
        description: "Comma-separated queries to run (default: all of search, search+, count, agg, union)"

permissions:
  contents: read
  checks: write

# Runs for the same PR share a group, so a new push to the PR's branch
# cancels the PR's run in progress.  Every other run (a push to main or a
# manual run) gets a group of its own, so it never waits for or cancels
# another run.
concurrency:
  group: perf-canary-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  perf-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v5
        with:
          path: ~/.cache/super-perf-canary
          key: perf-canary-data-v1
      - name: Choose what to compare
        id: config
        env:
          EVENT: ${{ github.event_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_SYSTEMS: ${{ inputs.systems }}
          INPUT_QUERIES: ${{ inputs.queries }}
        run: |
          base='' target='' runs=5 systems='' queries='' pr=''
          case "$EVENT" in
            pull_request)
              # The checkout is the PR merged into main, so the default base
              # (its merge-base with main) is the tip of main.  The merge
              # commit is GitHub's and isn't on any branch, so the report
              # names the PR and its head commit too.
              systems=super-bsup,super-json,super-parquet pr=$PR_URL
              ;;
            push)
              # The default base would be the new commit itself, so compare
              # with the previous tip of main instead.
              if [[ "$BEFORE" =~ ^0*$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                base=HEAD^
              else
                base=$BEFORE
              fi
              ;;
            workflow_dispatch)
              base=$INPUT_BASE target=$INPUT_TARGET runs=${INPUT_RUNS:-5} systems=$INPUT_SYSTEMS queries=$INPUT_QUERIES
              ;;
          esac
          {
            echo "base=$base"
            echo "target=$target"
            echo "runs=$runs"
            echo "systems=$systems"
            echo "queries=$queries"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"
      - name: Run perf canary
        env:
          BASE: ${{ steps.config.outputs.base }}
          TARGET: ${{ steps.config.outputs.target }}
          RUNS: ${{ steps.config.outputs.runs }}
          SYSTEMS: ${{ steps.config.outputs.systems }}
          QUERIES: ${{ steps.config.outputs.queries }}
          PR: ${{ steps.config.outputs.pr }}
        run: |
          make perf BASE="$BASE" TARGET="$TARGET" SYSTEMS="$SYSTEMS" QUERIES="$QUERIES" \
            PERF_CANARY_FLAGS="-runs $RUNS -datadir $HOME/.cache/super-perf-canary -out $RUNNER_TEMP/perf-canary ${PR:+-pr $PR}"
      - name: Report
        id: report
        if: always()
        run: |
          out="$RUNNER_TEMP/perf-canary"
          if [ ! -s "$out/results.json" ]; then
            echo "::error title=Perf canary::No results were produced (see the log)"
            exit 0
          fi
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          title=$(head -1 "$out/summary.md" | sed 's/^## //')
          case "$(jq -r .verdict "$out/results.json")" in
            regressed|attention)
              echo "::error title=Perf canary::$title"
              conclusion=failure
              ;;
            *)
              echo "::notice title=Perf canary::$title"
              conclusion=success
              ;;
          esac
          {
            echo "title=$title"
            echo "conclusion=$conclusion"
          } >> "$GITHUB_OUTPUT"
      # A pull request from a fork gets a read-only token that can't create
      # checks, so its results are only in the job summary.
      - name: Post "Perf canary results" check
        if: always() && steps.report.outputs.title != '' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ steps.report.outputs.title }}
          CONCLUSION: ${{ steps.report.outputs.conclusion }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A check's summary is limited to 65,535 characters, so a longer
        # report is cut short there (the job summary has all of it).
        run: |
          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg url "$DETAILS_URL" \
            --rawfile summary "$RUNNER_TEMP/perf-canary/summary.md" \
            '($summary | if length > 65000 then .[:65000] + "\n\n… (cut short; see the job summary for the full report)" else . end) as $summary |
             {name: "Perf canary results", head_sha: $sha, status: "completed",
              conclusion: $conclusion, details_url: $url,
              output: {title: $title, summary: $summary}}' |
            gh api "repos/$REPO/check-runs" --input - > /dev/null
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-canary
          path: ${{ runner.temp }}/perf-canary
