spq: rename f:=foo, b:=bar

input: |
  {foo:"foo0"}
  {foo:"foo1",goo:"goo1"}
  {bar:"bar2"}
  {goo:"goo3",bar:"bar3"}
  {bar:"bar4",goo:"goo4",foo:"foo4"}
  {goo:"goo5"}
  {foo:"hello"::(string|null)}
  {foo:null::(string|null)}
  super({foo:"foo",bar?:none::string},<{foo:string}>)
  super({foo:"foo",bar?:"bar"},<{foo:string,bar:string}>)

output: |
  {f:"foo0"}
  {f:"foo1",goo:"goo1"}
  {b:"bar2"}
  {goo:"goo3",b:"bar3"}
  {b:"bar4",goo:"goo4",f:"foo4"}
  {goo:"goo5"}
  {f:"hello"::(string|null)}
  {f:null::(string|null)}
  {f:"foo"}
  {f:"foo",b:"bar"}
