spq: sort

input: |
  16::uint16
  32::uint32
  64::uint64
  -16::int16
  -32::int32
  -64
  -32.32::float32
  32.32::float32
  -64.64
  64.64
  -Inf
  +Inf
  NaN

output: |
  -Inf
  -64.64
  -64
  -32.32::float32
  -32::int32
  -16::int16
  16::uint16
  32::uint32
  32.32::float32
  64::uint64
  64.64
  +Inf
  NaN

---

# NaN is ordered after all other numbers, so it's first in descending order.
spq: sort -r

input: |
  1.
  NaN
  +Inf
  -Inf

output: |
  NaN
  +Inf
  1.
  -Inf
