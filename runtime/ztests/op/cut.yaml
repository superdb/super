spq: cut foo

flags: -dynamic

input: |
  {foo:1,bar:"one"}
  {foo:2,bar:"two"}
  {foo:1::(int64|null),bar:"x"}
  {foo:null::(int64|null),bar:"x"}
  {bar:"three"}
  null

output: |
  {foo:1}
  {foo:2}
  {foo:1::(int64|null)}
  {foo:null::(int64|null)}
  {foo:error("no such field foo")}
  {foo:error("cannot access field 'foo' of null")}
