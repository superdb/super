spq: superfuse

flags: -superfused

input: |
  {a:"hello",b:"world"}
  {b:"goodnight",c:"gracie"}
  {a:"goodnight",b:123::int32}
  {a:null,b:null,c:null}

output: |
  {a:super("hello"::(string|null|missing),<string>),b:super("world"::(int32|string|null),<string>),c:super(missing::(string|null|missing),<missing>)}
  {a:super(missing::(string|null|missing),<missing>),b:super("goodnight"::(int32|string|null),<string>),c:super("gracie"::(string|null|missing),<string>)}
  {a:super("goodnight"::(string|null|missing),<string>),b:super(123::int32::(int32|string|null),<int32>),c:super(missing::(string|null|missing),<missing>)}
  {a:super(null::(string|null|missing),<null>),b:super(null::(int32|string|null),<null>),c:super(null::(string|null|missing),<null>)}

---

# Test superfuse on an array of records.
spq: superfuse

flags: -superfused

input: |
  [{a:1}]
  [{b:2}]
  [{a:3},{b:3}]
  [{a:3,b:3}]
  [{a:null,b:null}]

output: |
  super([super({a:super(1::(int64|null|missing),<int64>),b:super(missing::(int64|null|missing),<missing>)},<{a:int64}>)],<[{a:int64}]>)
  super([super({a:super(missing::(int64|null|missing),<missing>),b:super(2::(int64|null|missing),<int64>)},<{b:int64}>)],<[{b:int64}]>)
  super([super({a:super(3::(int64|null|missing),<int64>),b:super(missing::(int64|null|missing),<missing>)},<{a:int64}>),super({a:super(missing::(int64|null|missing),<missing>),b:super(3::(int64|null|missing),<int64>)},<{b:int64}>)],<[{a:int64}|{b:int64}]>)
  super([super({a:super(3::(int64|null|missing),<int64>),b:super(3::(int64|null|missing),<int64>)},<{a:int64,b:int64}>)],<[{a:int64,b:int64}]>)
  super([super({a:super(null::(int64|null|missing),<null>),b:super(null::(int64|null|missing),<null>)},<{a:null,b:null}>)],<[{a:null,b:null}]>)

---

# Test superfuse on mix of complex and primitive values.
spq: superfuse

flags: -superfused

input: |
  {a:1}
  {a:"s"}
  1
  "s"
  [1]
  ["s"]

output: |
  super({a:super(1::(int64|string),<int64>)}::(int64|string|{a:super(int64|string)}|[super(int64|string)]),<{a:int64}>)
  super({a:super("s"::(int64|string),<string>)}::(int64|string|{a:super(int64|string)}|[super(int64|string)]),<{a:string}>)
  super(1::(int64|string|{a:super(int64|string)}|[super(int64|string)]),<int64>)
  super("s"::(int64|string|{a:super(int64|string)}|[super(int64|string)]),<string>)
  super([super(1::(int64|string),<int64>)]::(int64|string|{a:super(int64|string)}|[super(int64|string)]),<[int64]>)
  super([super("s"::(int64|string),<string>)]::(int64|string|{a:super(int64|string)}|[super(int64|string)]),<[string]>)

---

# Test superfuse on nested records.
spq: superfuse

flags: -superfused

input: |
  {a:"hello",r:{x:1::int32,y:2::int32}}
  {r:{y:4::int32,z:5::int32},s:"world",r2:{x:6::int32}}
  {a:null,r:{x:null,y:null,z:null},s:null,r2:null}

output: |
  {a:super("hello"::(string|null|missing),<string>),r:{x:super(1::int32::(int32|null|missing),<int32>),y:super(2::int32::(int32|null),<int32>),z:super(missing::(int32|null|missing),<missing>)},s:super(missing::(string|null|missing),<missing>),r2:super(missing::(null|missing|{x:int32}),<missing>)}
  {a:super(missing::(string|null|missing),<missing>),r:{x:super(missing::(int32|null|missing),<missing>),y:super(4::int32::(int32|null),<int32>),z:super(5::int32::(int32|null|missing),<int32>)},s:super("world"::(string|null|missing),<string>),r2:super({x:6::int32}::(null|missing|{x:int32}),<{x:int32}>)}
  {a:super(null::(string|null|missing),<null>),r:{x:super(null::(int32|null|missing),<null>),y:super(null::(int32|null),<null>),z:super(null::(int32|null|missing),<null>)},s:super(null::(string|null|missing),<null>),r2:super(null::(null|missing|{x:int32}),<null>)}

---

spq: superfuse

flags: -superfused

input: |
  error(1)
  error("s")

output: |
  super(error(super(1::(int64|string),<int64>)),<error(int64)>)
  super(error(super("s"::(int64|string),<string>)),<error(string)>)

