spq: superfuse

flags: -superfused

input: |
  {a:[1,2]}
  {a:["foo"]}
  {a:[null]}

output: |
  {a:super([super(1::(int64|string|null),<int64>),super(2::(int64|string|null),<int64>)],<[int64]>)}
