spq: superfuse

flags: -fusion

input: |
  {a:"hello",b:"world"}
  {b:"goodnight",c:"gracie"}
  {a:"goodnight",b:123::int32}
  {a:null,b:null,c:null}

output: |
  {a:fusion("hello"::(string|null|none),<string>),b:fusion("world"::(int32|string|null),<string>),c:fusion(none::(string|null|none),<none>)}
  {a:fusion(none::(string|null|none),<none>),b:fusion("goodnight"::(int32|string|null),<string>),c:fusion("gracie"::(string|null|none),<string>)}
  {a:fusion("goodnight"::(string|null|none),<string>),b:fusion(123::int32::(int32|string|null),<int32>),c:fusion(none::(string|null|none),<none>)}
  {a:fusion(null::(string|null|none),<null>),b:fusion(null::(int32|string|null),<null>),c:fusion(null::(string|null|none),<null>)}

---

# Test superfuse on an array of records.
spq: superfuse

flags: -fusion

input: |
  [{a:1}]
  [{b:2}]
  [{a:3},{b:3}]
  [{a:3,b:3}]
  [{a:null,b:null}]

output: |
  fusion([fusion({a:fusion(1::(int64|null|none),<int64>),b:fusion(none::(int64|null|none),<none>)},<{a:int64}>)],<[{a:int64}]>)
  fusion([fusion({a:fusion(none::(int64|null|none),<none>),b:fusion(2::(int64|null|none),<int64>)},<{b:int64}>)],<[{b:int64}]>)
  fusion([fusion({a:fusion(3::(int64|null|none),<int64>),b:fusion(none::(int64|null|none),<none>)},<{a:int64}>),fusion({a:fusion(none::(int64|null|none),<none>),b:fusion(3::(int64|null|none),<int64>)},<{b:int64}>)],<[{a:int64}|{b:int64}]>)
  fusion([fusion({a:fusion(3::(int64|null|none),<int64>),b:fusion(3::(int64|null|none),<int64>)},<{a:int64,b:int64}>)],<[{a:int64,b:int64}]>)
  fusion([fusion({a:fusion(null::(int64|null|none),<null>),b:fusion(null::(int64|null|none),<null>)},<{a:null,b:null}>)],<[{a:null,b:null}]>)

---

# Test superfuse on mix of complex and primitive values.
spq: superfuse

flags: -fusion

input: |
  {a:1}
  {a:"s"}
  1
  "s"
  [1]
  ["s"]

output: |
  fusion({a:fusion(1::(int64|string),<int64>)}::(int64|string|{a:fusion(int64|string)}|[fusion(int64|string)]),<{a:int64}>)
  fusion({a:fusion("s"::(int64|string),<string>)}::(int64|string|{a:fusion(int64|string)}|[fusion(int64|string)]),<{a:string}>)
  fusion(1::(int64|string|{a:fusion(int64|string)}|[fusion(int64|string)]),<int64>)
  fusion("s"::(int64|string|{a:fusion(int64|string)}|[fusion(int64|string)]),<string>)
  fusion([fusion(1::(int64|string),<int64>)]::(int64|string|{a:fusion(int64|string)}|[fusion(int64|string)]),<[int64]>)
  fusion([fusion("s"::(int64|string),<string>)]::(int64|string|{a:fusion(int64|string)}|[fusion(int64|string)]),<[string]>)

---

# Test superfuse on nested records.
spq: superfuse

flags: -fusion

input: |
  {a:"hello",r:{x:1::int32,y:2::int32}}
  {r:{y:4::int32,z:5::int32},s:"world",r2:{x:6::int32}}
  {a:null,r:{x:null,y:null,z:null},s:null,r2:null}

output: |
  {a:fusion("hello"::(string|null|none),<string>),r:{x:fusion(1::int32::(int32|null|none),<int32>),y:fusion(2::int32::(int32|null),<int32>),z:fusion(none::(int32|null|none),<none>)},s:fusion(none::(string|null|none),<none>),r2:fusion(none::(null|none|{x:int32}),<none>)}
  {a:fusion(none::(string|null|none),<none>),r:{x:fusion(none::(int32|null|none),<none>),y:fusion(4::int32::(int32|null),<int32>),z:fusion(5::int32::(int32|null|none),<int32>)},s:fusion("world"::(string|null|none),<string>),r2:fusion({x:6::int32}::(null|none|{x:int32}),<{x:int32}>)}
  {a:fusion(null::(string|null|none),<null>),r:{x:fusion(null::(int32|null|none),<null>),y:fusion(null::(int32|null),<null>),z:fusion(null::(int32|null|none),<null>)},s:fusion(null::(string|null|none),<null>),r2:fusion(null::(null|none|{x:int32}),<null>)}

