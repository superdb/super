  super([super(1::(int64|string|null),<int64>),super(2::(int64|string|null),<int64>)],<[int64]>)
  super([super("foo"::(int64|string|null),<string>)],<[string]>)
  super([super(null::(int64|string|null),<null>)],<[null]>)

