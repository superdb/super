spq: superfuse

flags: -fusion

input: |
  error(1)
  error("s")

output: |
  fusion(error(fusion(1::(int64|string),<int64>)),<error(int64)>)
  fusion(error(fusion("s"::(int64|string),<string>)),<error(string)>)

