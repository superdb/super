spq: superfuse

flags: -fusion

input: |
  {a:[1,2]}
  {a:["foo"]}
  {a:[null]}

output: |
  {a:fusion([fusion(1::(int64|string|null),<int64>),fusion(2::(int64|string|null),<int64>)],<[int64]>)}
