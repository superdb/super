  {a:super([super(null::(int64|string|null),<null>)],<[null]>)}

---

spq: superfuse

flags: -superfused

input: |
  type p1=int64
  1::p1
  type r1=int64
  type r2={a:r1}
  {a:1}::r2
  type a1=int64
  type a2=[a1]
  [1]::"a2"
  type s1=int64
  type s2=set[s1]
  set[1]::s2
  type m1=int64
  type m2=int64
  type m3=map{m1:m2}
  map{1:2}::m3
  type u1=int64
  type u3=string
  type u2=u1|u3
  1::u1::u2
  type en1=enum(a,b)
  "a"::en1
  type er1=int64
  type er2=error(er1)
  error(1)::er2

output: |
  type a1=int64
  type a2=[a1]
  type en1=enum(a,b)
  type er1=int64
  type er2=error(er1)
  type m1=int64
  type m2=int64
  type m3=map{m1:m2}
  type p1=int64
  type r1=int64
  type r2={a:r1}
  type s1=int64
  type s2=set[s1]
  type u1=int64
  type u3=string
  type u2=u1|u3
  super(1::p1::(a2|en1|er2|m3|p1|r2|s2|u2),<p1>)
  super({a:1}::r2::(a2|en1|er2|m3|p1|r2|s2|u2),<r2>)
  super([1]::"a2"::(a2|en1|er2|m3|p1|r2|s2|u2),<a2>)
  super(set[1]::s2::(a2|en1|er2|m3|p1|r2|s2|u2),<s2>)
  super(map{1:2}::m3::(a2|en1|er2|m3|p1|r2|s2|u2),<m3>)
  super(1::u1::u2::(a2|en1|er2|m3|p1|r2|s2|u2),<u2>)
  super("a"::en1::(a2|en1|er2|m3|p1|r2|s2|u2),<en1>)
  super(error(1)::er2::(a2|en1|er2|m3|p1|r2|s2|u2),<er2>)

---

# Test superfuse on super values
spq: unnest this into ( superfuse )

input: |
  [super({x?:1,y?:none::int64},<{x:int64}>)]
  [super({x?:1,y?:none::int64},<{x:int64}>),super({x?:none::int64,y?:2},<{y:int64}>)]
  [1,super(2::(int64|null),<int64>)]

output: |
  {x:1}
  {x:1}
  {y:2}
  1
  2

