spq: superfuse | values x

flags: -superfused -dynamic

input: |
  {x:{y:1}}
  {}

output: |
  super({y:1}::(missing|{y:int64}),<{y:int64}>)
  error("no such field x")

---

spq: superfuse | values x.ok() ?? 123

input: |
  {x:{y:1}}
  {}

output: |
  {y:1}
  123
