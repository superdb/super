spq: distinct x.ok()

input: |
  {x:1}
  {x:2}
  {x:2}
  {y:3}
  type named={y:int64}
  {y:3}::named

output: |
  {x:1}
  {x:2}
  {y:3}

---

spq: distinct abs(this)

input: |
  1
  -2
  2
  3

output: |
  1
  -2
  3

---

spq: unnest this into (distinct this | count())

input: |
  [1,2,2,3]
  [2,2,3]

output: |
  3
  2

---

# NaN equals NaN and -0 differs from +0.  SUP formats -0 as 0., so 1./x
# shows which zero each row is.
spq: distinct x | values {x, inv:1./x}

input: |
  {x:NaN}
  {x:0.}
  {x:-0.}
  {x:NaN}
  {x:1.5}
  {x:0.}

output: |
  {x:NaN,inv:NaN}
  {x:0.,inv:+Inf}
  {x:0.,inv:-Inf}
  {x:1.5,inv:0.6666666666666666}

---

# tail holds the vectors from distinct while it pulls the next one.
spq: fork (values {x:a}) (values {x:b}) | distinct x | tail 10 | sort x

input: |
  {a:1,b:3}
  {a:1,b:4}
  {a:2,b:5}

output: |
  {x:1}
  {x:2}
  {x:3}
  {x:4}
  {x:5}
