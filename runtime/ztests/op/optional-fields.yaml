spq: distinct b

input: |
  {a:1,b?:"foo"}
  {a:1,b?:none::string}
  {a:1,b:"foo"}
  {a:1,b:fusion("foo"::(string|missing),<string>)}

output: |
  {a:1,b?:"foo"}
  {a:1,b?:none::string}
  {a:1,b:"foo"}

---

spq: drop a

input: |
  {a:1,b?:"foo"}
  {a:1,b?:none::string}
  {a:1,b:"foo"}

output: |
  {b?:"foo"}
  {b?:none::string}
  {b:"foo"}

---

spq: drop b

input: |
  {a:1,b?:"foo"}
  {a:1,b?:none::string}
  {a:1,b:"foo"}

output: |
  {a:1}
  {a:1}
  {a:1}

---

spq: rename c:=b

input: |
  {a:1,b?:"foo"}
  {a:1,b?:none::string}
  {a?:1,b:"foo"}

output: |
  {a:1,c?:"foo"}
  {a:1,c?:none::string}
  {a?:1,c:"foo"}
