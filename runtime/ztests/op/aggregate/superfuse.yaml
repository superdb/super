spq: supertype:=superfuse(this) by key | sort key

input: |
  {a:"hello",r:{x:1::int32,y:2::int32},key:"a"}
  {a:"hello",r:{x:1::int32,y:2::int32},key:"b"}
  {a:"hello",r:{x:1::int32,y:2::int32},key:"c"}
  {r:{y:4::int32,z:5::int32},s:"world",r2:{x:6::int32},key:"a"}
  {r:{y:4::int32,z:5::int32},s:"world",r2:{x:6::int32},key:"b"}
  {r:{y:4::int32,z:5::int32},s:"world",r2:{x:6::int32},key:"c"}

output: |
  {key:"a",supertype:<{a:fusion(string|none),r:{x:fusion(int32|none),y:int32,z:fusion(int32|none)},s:fusion(string|none),r2:fusion(none|{x:int32}),key:string}>}
  {key:"b",supertype:<{a:fusion(string|none),r:{x:fusion(int32|none),y:int32,z:fusion(int32|none)},s:fusion(string|none),r2:fusion(none|{x:int32}),key:string}>}
  {key:"c",supertype:<{a:fusion(string|none),r:{x:fusion(int32|none),y:int32,z:fusion(int32|none)},s:fusion(string|none),r2:fusion(none|{x:int32}),key:string}>}

---

spq: superfuse(this)

input: |
  {fixed:{x:1},var:{s:"foo"}}
  {fixed:{x:2},var:{s:"bar",a:[1,2]}}
  {fixed:{x:3},var:{s:"bar",a:[3]}}
  {fixed:{x:4},var:{s:"foo",t:123}}
  {fixed:{x:5},var:{s:"foo",t:{x:1}}}

output: |
  <{fixed:{x:int64},var:{s:string,a:fusion(none|[int64]),t:fusion(int64|none|{x:int64})}}>

---

spq: superfuse(this)

input: |
  {a:[1,2]}
  {a:["foo"]}
  {a:[null]}

output: |
  <{a:fusion([fusion(int64|string|null)])}>

---

spq: unnest this into ( superfuse(this) )

input: |
  [map{1:2}]
  [map{1:2},map{3:4}]
  [map{1:2},map{"3":"4"}]

output: |
  <map{int64:int64}>
  <map{int64:int64}>
  <fusion(map{fusion(int64|string):fusion(int64|string)})>

---

spq: superfuse(this)

input: |
  type u1=int64
  type u2=u1|string
  1::u1::u2

output: |
  type u1=int64
  type u2=u1|string
  <u2>

---

spq: superfuse(this) by x:=1

input: |
  type u1=int64
  type u2=u1
  1::u1::u2

output: |
  type u1=int64
  type u2=u1
  {x:1,superfuse:<u2>}

---

spq: superfuse(this)

input: |
  type n1=[int64]
  type n2=int64
  [1]::n1
  [2::n2]
  [3]

output: |
  type n1=[int64]
  type n2=int64
  <fusion(n1|[fusion(n2|int64)])>

---

spq: superfuse(this)

input: |
  {x:{y:1}}
  {}

output: |
  <{x:fusion(none|{y:int64})}>

---

spq: superfuse(this)

input: |
  {x?:1}
  {x?:2,y:3}

output: |
  <{x?:int64,y:fusion(int64|none)}>

---

spq: superfuse(this)

input: |
  {x?:2,y:3}
  {x?:1}

output: |
  <{x?:int64,y:fusion(int64|none)}>
