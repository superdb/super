spq: |
  aggregate
    and(distinct b),
    any(distinct n),
    array_agg(distinct key),
    avg(distinct n),
    collect(distinct key),
    count(distinct n),
    dcount(distinct n),
    -- superfuse() is not yet supported by vector runtime.
    max(distinct n),
    min(distinct n),
    or(distinct b),
    sum(distinct n),
    union(distinct n) by key
  | sort key

input: |
  {key:"a",n:1,b:true}
  {key:"a",n:2,b:false}
  {key:"b",n:1,b:true}
  {key:"b",n:0,b:true}
  {key:"c",n:error("missing"),b:error("missing")}

output: |
  {key:"a",and:false,any:1,array_agg:["a"],avg:1.5,collect:["a"],count:2,dcount:2,max:2,min:1,or:true,sum:3,union:set[1,2]}
  {key:"b",and:true,any:1,array_agg:["b"],avg:0.5,collect:["b"],count:2,dcount:2,max:1,min:0,or:true,sum:1,union:set[0,1]}
  {key:"c",and:null,any:error("missing"),array_agg:["c"],avg:null,collect:["c"],count:1,dcount:1,max:null,min:null,or:null,sum:null,union:set[error("missing")]}

---

# Issue #6803
script: |
  super -s -c 'aggregate count(distinct this)' -

inputs:
  - name: stdin
    data: |
      1

outputs:
  - name: stdout
    data: |
      1
