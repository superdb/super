# A plain none group key (e.g., from ok()) disappears from its output record,
# including when the aggregate is split into partials (as for a file scan)
# and for a nested key.  With a single unnamed key and no aggregate
# functions, the none key is dropped, but an error key isn't.  An aggregate
# function's none result isn't a key, so it isn't dropped (as for shapes,
# whose sample is from any).  Keys and aggregate values interleaved in
# nested records are assigned to the right fields.
script: |
  super -s -c 'values {a:1},{b:2},{b:3} | count() by k:=ok(a) | sort count'
  echo ===
  super -s -c 'from test.sup | count() by k:=ok(a) | sort count'
  echo ===
  super -s -c 'from test.sup | count() by x.k:=ok(a) | sort count'
  echo ===
  super -s -c 'from test.sup | aggregate by ok(a)'
  echo ===
  super -s -c 'values {a:1},{b:2},{b:3} | aggregate by ok(a)'
  echo ===
  super -s -c 'values {a:1},{b:2} | shapes ok(a)'
  echo ===
  super -s -c 'values {a:1},{a:error("x")} | aggregate by a | sort this'
  echo ===
  super -s -c 'from errors.sup | aggregate by a | sort this'
  echo ===
  super -s -c 'values {a:1,b:3},{b:4} | aggregate r.c:=count(), y:=sum(b) by r.k:=b, x:=a.ok() | sort r.k'

inputs:
  - name: test.sup
    data: |
      {a:1}
      {b:2}
      {b:3}
  - name: errors.sup
    data: |
      {a:1}
      {a:error("x")}
      {a:1}

outputs:
  - name: stdout
    data: |
      {k:1,count:1}
      {count:2}
      ===
      {k:1,count:1}
      {count:2}
      ===
      {x:{k:1},count:1}
      {x:{},count:2}
      ===
      1
      ===
      1
      ===
      1
      ===
      1
      error("x")
      ===
      1
      error("x")
      ===
      {r:{k:3,c:1},x:1,y:3}
      {r:{k:4,c:1},y:4}
