spq: |
  where false
  | count(*), sum(this), and(this), or(this), min(this), avg(this), collect(this), array_agg(this)

output: |
  {count:0,collect:[]}

---

# Test that scalar aggregations with no inputs work in an unnset subquery.
spq: |
  unnest this into ( where false | count(*) )

input: |
  [null]
  [null]

output: |
  0
  0
