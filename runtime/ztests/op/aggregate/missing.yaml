spq: |
  by a:=a[0], b:=b.c | sort this

flags: -dynamic

input: |
  {a:"a",b:"b"}
  {a:[]::[null],b:{c:1}}
  {a:[0],b:{c:1}}

output: |
  {a:0,b:1}
  {a:error({message:"index out of range",on:0}),b:1}
  {a:error({message:"value cannot be indexed",on:"a"}),b:error("cannot access field 'c' of string")}
