spq: fuse

input: |
  {a:"hello",b:"world"}
  {b:"goodnight",c:"gracie"}
  {a:"goodnight",b:123::int32}
  {a:null,b:null,c:null}

output: |
  {a:"hello"::(string|null|none),b:"world"::(int32|string|null),c:none::(string|null|none)}
  {a:none::(string|null|none),b:"goodnight"::(int32|string|null),c:"gracie"::(string|null|none)}
  {a:"goodnight"::(string|null|none),b:123::int32::(int32|string|null),c:none::(string|null|none)}
  {a:null::(string|null|none),b:null::(int32|string|null),c:null::(string|null|none)}

---

# Test fuse on an array of records.
spq: fuse

input: |
  [{a:1}]
  [{b:2}]
  [{a:3},{b:3}]
  [{a:3,b:3}]
  [{a:null,b:null}]

output: |
  [{a:1::(int64|null|none),b:none::(int64|null|none)}]
  [{a:none::(int64|null|none),b:2::(int64|null|none)}]
  [{a:3::(int64|null|none),b:none::(int64|null|none)},{a:none::(int64|null|none),b:3::(int64|null|none)}]
  [{a:3::(int64|null|none),b:3::(int64|null|none)}]
  [{a:null::(int64|null|none),b:null::(int64|null|none)}]

---

# Test fuse on mix of complex and primitive values.
spq: fuse

input: |
  {a:1}
  {a:"s"}
  1
  "s"
  [1]
  ["s"]

output: |
  {a:1::(int64|string)}::(int64|string|{a:int64|string}|[int64|string])
  {a:"s"::(int64|string)}::(int64|string|{a:int64|string}|[int64|string])
  1::(int64|string|{a:int64|string}|[int64|string])
  "s"::(int64|string|{a:int64|string}|[int64|string])
  [1]::[int64|string]::(int64|string|{a:int64|string}|[int64|string])
  ["s"]::[int64|string]::(int64|string|{a:int64|string}|[int64|string])

---

# Test fuse on nested records.
spq: fuse

input: |
  {a:"hello",r:{x:1::int32,y:2::int32}}
  {r:{y:4::int32,z:5::int32},s:"world",r2:{x:6::int32}}
  {a:null,r:{x:null,y:null,z:null},s:null,r2:null}

output: |
  {a:"hello"::(string|null|none),r:{x:1::int32::(int32|null|none),y:2::int32::(int32|null),z:none::(int32|null|none)},s:none::(string|null|none),r2:none::(null|none|{x:int32})}
  {a:none::(string|null|none),r:{x:none::(int32|null|none),y:4::int32::(int32|null),z:5::int32::(int32|null|none)},s:"world"::(string|null|none),r2:{x:6::int32}::(null|none|{x:int32})}
  {a:null::(string|null|none),r:{x:null::(int32|null|none),y:null::(int32|null),z:null::(int32|null|none)},s:null::(string|null|none),r2:null::(null|none|{x:int32})}

