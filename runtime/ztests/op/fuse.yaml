# Test fuse on fusion values
spq: unnest this into ( superfuse )

input: |
  [fusion({x?:1,y?:none::int64},<{x:int64}>)]
  [fusion({x?:1,y?:none::int64},<{x:int64}>),fusion({x?:none::int64,y?:2},<{y:int64}>)]
  [1,fusion(2::(int64|null),<int64>)]

output: |
  {x:1}
  {x:1}
  {y:2}
  1
  2

---

spq: superfuse | values x

flags: -fusion -dynamic

input: |
  {x:{y:1}}
  {}

output: |
  fusion({y:1}::(none|{y:int64}),<{y:int64}>)
  error("no such field x")

