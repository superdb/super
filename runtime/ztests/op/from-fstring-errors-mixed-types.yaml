# from with a computed path returns an error value for each input value whose
# path or HTTP option is bad, also when its input mixes values of different
# types (e.g., records of different types, or values with two expressions).
script: |
  # A path that isn't a string.
  super -s -c "from in.sup | from f'{a}'"
  echo ===
  # HTTP options with a path that isn't an HTTP URL (from values with two
  # expressions, whose values have the same type).
  super -s -c "values 'x.sup','y.sup' | from f'{this}' (method 'POST')"
  echo ===
  # A method that isn't a string, then headers that aren't strings.
  super -s -c "from method.sup | from f'{u}' (method f'{m}' headers {A:n})"
  echo ===
  # Headers that aren't a record.
  super -s -c "from headers.sup | from f'{u}' (headers h)"
  echo ===
  # A body that isn't a string or bytes.
  super -s -c "from body.sup | from f'{u}' (body b)"

inputs:
  - name: a.sup
    data: |
      {x:1}
  - name: in.sup
    data: |
      {a:"a.sup"}
      {b:1}
  - name: method.sup
    data: |
      {u:"http://127.0.0.1/x",n:1}
      {u:"http://127.0.0.1/y",m:"POST",n:2}
  - name: headers.sup
    data: |
      {u:"http://127.0.0.1/x",h:1}
      {u:"http://127.0.0.1/y",h:"s"}
  - name: body.sup
    data: |
      {u:"http://127.0.0.1/x",b:1}
      {u:"http://127.0.0.1/y",b:[1]}

outputs:
  - name: stdout
    data: |
      {x:1}
      error({message:"from: non-string input",on:error("no such field a")})
      ===
      error({message:"from: method, headers, and body require an http or https URL",on:"x.sup"})
      error({message:"from: method, headers, and body require an http or https URL",on:"y.sup"})
      ===
      error({message:"from: method value must be a string",on:error("no such field m")})
      error({message:"from: header field value must be a string or an array or set of strings",on:{A:2}})
      ===
      error({message:"from: headers value must be a record",on:1})
      error({message:"from: headers value must be a record",on:"s"})
      ===
      error({message:"from: body value must be a string or bytes",on:1})
      error({message:"from: body value must be a string or bytes",on:[1]})
