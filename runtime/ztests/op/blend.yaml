spq: blend

input: |
  {a:"hello",b:"world"}
  {b:"goodnight",c:"gracie"}
  {a:"goodnight",b:123::int32}
  {a:null,b:null,c:null}

output: |
  {a:"hello"::(string|null|missing),b:"world"::(int32|string|null),c:none::(string|null|missing)}
  {a:none::(string|null|missing),b:"goodnight"::(int32|string|null),c:"gracie"::(string|null|missing)}
  {a:"goodnight"::(string|null|missing),b:123::int32::(int32|string|null),c:none::(string|null|missing)}
  {a:null::(string|null|missing),b:null::(int32|string|null),c:null::(string|null|missing)}

---

# Test blend on an array of records.
spq: blend

input: |
  [{a:1}]
  [{b:2}]
  [{a:3},{b:3}]
  [{a:3,b:3}]
  [{a:null,b:null}]

output: |
  [{a:1::(int64|null|missing),b:none::(int64|null|missing)}]
  [{a:none::(int64|null|missing),b:2::(int64|null|missing)}]
  [{a:3::(int64|null|missing),b:none::(int64|null|missing)},{a:none::(int64|null|missing),b:3::(int64|null|missing)}]
  [{a:3::(int64|null|missing),b:3::(int64|null|missing)}]
  [{a:null::(int64|null|missing),b:null::(int64|null|missing)}]

---

# Test blend on mix of complex and primitive values.
spq: blend

input: |
  {a:1}
  {a:"s"}
  1
  "s"
  [1]
  ["s"]

output: |
  {a:1::(int64|string)}::(int64|string|{a:int64|string}|[int64|string])
  {a:"s"::(int64|string)}::(int64|string|{a:int64|string}|[int64|string])
  1::(int64|string|{a:int64|string}|[int64|string])
  "s"::(int64|string|{a:int64|string}|[int64|string])
  [1]::[int64|string]::(int64|string|{a:int64|string}|[int64|string])
  ["s"]::[int64|string]::(int64|string|{a:int64|string}|[int64|string])

---

# Test blend on nested records.
spq: blend

input: |
  {a:"hello",r:{x:1::int32,y:2::int32}}
  {r:{y:4::int32,z:5::int32},s:"world",r2:{x:6::int32}}
  {a:null,r:{x:null,y:null,z:null},s:null,r2:null}

output: |
  {a:"hello"::(string|null|missing),r:{x:1::int32::(int32|null|missing),y:2::int32::(int32|null),z:none::(int32|null|missing)},s:none::(string|null|missing),r2:none::(null|missing|{x:int32})}
  {a:none::(string|null|missing),r:{x:none::(int32|null|missing),y:4::int32::(int32|null),z:5::int32::(int32|null|missing)},s:"world"::(string|null|missing),r2:{x:6::int32}::(null|missing|{x:int32})}
  {a:null::(string|null|missing),r:{x:null::(int32|null|missing),y:null::(int32|null),z:null::(int32|null|missing)},s:null::(string|null|missing),r2:null::(null|missing|{x:int32})}

