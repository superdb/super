script: |
  super -s -c 'left join (from B.sup) as {l,r} using (s) | values {...l,...r} | sort' A.sup
  echo ===
  super -s -c 'left join (from B.sup) as {l,r} on lower(r.s)=l.s | sort' A.sup
  echo ===
  super -s -c 'left join (from B.sup) on (lower(right.s))=(lower(left.s)) | values {...left,b:this?.right?.b} | sort' A.sup
  echo === nested loop join
  super -s -c 'left join (from B.sup) on lower(left.s)<lower(right.s) | values {...left,b:this?.right?.b} | sort' A.sup

inputs:
  - name: A.sup
    data: |
      {a:1::int32,s:"a"}
      {a:2::int32,s:"B"}
      {a:3::int32,s:"c"}
  - name: B.sup
    data: |
      {b:4::int32,s:"A"}
      {b:5::int32,s:"b"}
      {b:6::int32,s:"c"}

outputs:
  - name: stdout
    data: |
      {a:1::int32,s:"a"}
      {a:2::int32,s:"B"}
      {a:3::int32,s:"c",b:6::int32}
      ===
      {l:{a:1::int32,s:"a"},r:{b:4::int32,s:"A"}}
      {l:{a:2::int32,s:"B"}}
      {l:{a:3::int32,s:"c"},r:{b:6::int32,s:"c"}}
      ===
      {a:1::int32,s:"a",b:4::int32}
      {a:2::int32,s:"B",b:5::int32}
      {a:3::int32,s:"c",b:6::int32}
      === nested loop join
      {a:1::int32,s:"a",b:5::int32}
      {a:1::int32,s:"a",b:6::int32}
      {a:2::int32,s:"B",b:6::int32}
      {a:3::int32,s:"c"}

---

# Issue #6361.
spq: |
  values {a:1,x:5},{a:2,x:6}
  | join (
    values {b:1,y:7},{b:2,y:4}
  ) as {l,r} on l.a=r.b and l.x > r.y

output: |
  {l:{a:2,x:6},r:{b:2,y:4}}
