spq: unnest this

input: |
  [1,2,3]
  ["4","5","6"]
  [7,8,9]
  type foo=int64
  [10::foo,11::foo]
  [fusion(12::(int64|string),<int64>),"13"]
  fusion([null,1,"a"],<[int64|string|null]>)
  null

output: |
  1
  2
  3
  "4"
  "5"
  "6"
  7
  8
  9
  type foo=int64
  10::foo
  11::foo
  12
  "13"
  null
  1
  "a"

---

spq: unnest b with a | values a+b

input: |
  {a:1,b:[1,2,3]}
  {a:2,b:[10,20,30]}
  {a:1,b:[]}

output: |
  2
  3
  4
  12
  22
  32

---

# Unnest on fusion values
spq: unnest y with x

flags: -dynamic

input: |
  fusion({x:"foo",y:[1,2],z?:none::int64},<{x:string,y:[int64]}>)
  fusion({x:"foo",y:[1,2],z?:3},<{x:string,y:[int64],z:int64}>)

output: |
  {y:1,x:"foo"}
  {y:2,x:"foo"}
  {y:1,x:"foo"}
  {y:2,x:"foo"}

---

# A record is not unnested unless a field is named, which is a static error
# when the record's type is known ...
spq: unnest this

input: |
  {x:"foo",y:[1,2]}

error: |
  unnest value must be an array at line 1, column 8:
  unnest this
         ~~~~

---

# ... and otherwise a runtime error.
spq: unnest this

flags: -dynamic

input: |
  {x:"foo",y:[1,2]}

output: |
  error({message:"unnest: encountered non-array value",on:{x:"foo",y:[1,2]}})

---

# A plain none to unnest produces no values as for an unnamed unnest.
spq: unnest x:=o?.a with s

flags: -dynamic

input: |
  {o:none::{a:[int64]},s:1}
  {o:some({a:[5]}),s:2}

output: |
  {x:5,s:2}

---

# A plain none to unnest (e.g., from ok()) produces no values.
spq: unnest ok(a)

input: |
  {a:[1,2]}
  {b:3}
  {a:[4]}

output: |
  1
  2
  4

---

# Statically, a plain none to unnest isn't an error.
spq: values {a:[1,2]},{b:3} | unnest ok(a) | values typeof(this)

output: |
  <int64>
  <int64>
