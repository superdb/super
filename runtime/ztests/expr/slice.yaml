spq: "cut a1:=a[1:-1],a2:=a[1:],a3:=a[:1],a4:=a[:-1],a5:=a[:-100],a6:=a[-1:],a7:=a[-2:-1],a8:=(a IS NOT NULL and len(a)>0) ? a[:a[1]-9] : null"

flags: -dynamic

input: |
  {a:null}
  {a:0x}
  {a:""}
  {a:[]::[int32]}
  {a:0x00112233}
  {a:"0123"}
  {a:"0\u2071\u20723"}
  {a:"\u2070\u2071\u2072\u2073"}
  {a:[10::int32,11::int32,12::int32,13::int32]}
  {a:set[10::int32,11::int32,12::int32,13::int32]}

output: |
  {a1:null,a2:null,a3:null,a4:null,a5:null,a6:null,a7:null,a8:null}
  {a1:0x,a2:0x,a3:0x,a4:0x,a5:0x,a6:0x,a7:0x,a8:null}
  {a1:"",a2:"",a3:"",a4:"",a5:"",a6:"",a7:"",a8:null}
  {a1:[]::[int32],a2:[]::[int32],a3:[]::[int32],a4:[]::[int32],a5:[]::[int32],a6:[]::[int32],a7:[]::[int32],a8:null}
  {a1:0x1122,a2:0x112233,a3:0x00,a4:0x001122,a5:0x,a6:0x33,a7:0x22,a8:error({message:"slice expression: error value encountered",on:error({message:"-: error value encountered",on:error({message:"value cannot be indexed",on:0x00112233})})})}
  {a1:"12",a2:"123",a3:"0",a4:"012",a5:"",a6:"3",a7:"2",a8:error({message:"slice expression: error value encountered",on:error({message:"-: error value encountered",on:error({message:"value cannot be indexed",on:"0123"})})})}
  {a1:"ⁱ⁲",a2:"ⁱ⁲3",a3:"0",a4:"0ⁱ⁲",a5:"",a6:"3",a7:"⁲",a8:error({message:"slice expression: error value encountered",on:error({message:"-: error value encountered",on:error({message:"value cannot be indexed",on:"0ⁱ⁲3"})})})}
  {a1:"ⁱ⁲",a2:"ⁱ⁲⁳",a3:"⁰",a4:"⁰ⁱ⁲",a5:"",a6:"⁳",a7:"⁲",a8:error({message:"slice expression: error value encountered",on:error({message:"-: error value encountered",on:error({message:"value cannot be indexed",on:"⁰ⁱ⁲⁳"})})})}
  {a1:[11::int32,12::int32],a2:[11::int32,12::int32,13::int32],a3:[10::int32],a4:[10::int32,11::int32,12::int32],a5:[]::[int32],a6:[13::int32],a7:[12::int32],a8:[10::int32,11::int32]}
  {a1:set[11::int32,12::int32],a2:set[11::int32,12::int32,13::int32],a3:set[10::int32],a4:set[10::int32,11::int32,12::int32],a5:set[]::set[int32],a6:set[13::int32],a7:set[12::int32],a8:set[10::int32,11::int32]}

---

# Test slice on union and fusion values
spq: this[1:]

flags: -dynamic

input: |
  [1,2,3]::(null|[int64])
  set[1,2,3]::(null|set[int64])
  "food"::(null|string)
  fusion("foo"::(string|[int64]),<string>)
  fusion([1,2,3]::(string|[int64]),<[int64]>)


output: |
  [2,3]
  set[2,3]
  "ood"
  "oo"
  [2,3]

---

# Test slice on values of named types, which yields values of the
# underlying types
spq: values this[1:]

flags: -dynamic

input: |
  type a=[int64]
  type st=set[int64]
  type b=bytes
  type s=string
  type s2=s
  [1,2,3]::a
  set[1,2,3]::st
  0x0102::b
  "food"::s
  "food"::s2

output: |
  [2,3]
  set[2,3]
  0x02
  "ood"
  "ood"

---

# Test slice with indexes of a named type
spq: values s[i:j]

flags: -dynamic

input: |
  type idx=int64
  {s:"food",i:1::idx,j:3::idx}

output: |
  "oo"
