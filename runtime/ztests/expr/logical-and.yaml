spq: |
  values case when typeof(this) == <string> 
    then this 
    else a AND b
  end

flags: -dynamic

input: |
  "=== TRUE ==="
  {a:true,b:true}
  {a:true,b:false}
  {a:true,b:null}
  {a:true}
  {a:true,b:"foo"}
  "=== FALSE ==="
  {a:false,b:true}
  {a:false,b:false}
  {a:false,b:null}
  {a:false}
  {a:false,b:"foo"}
  "=== NULL ==="
  {a:null,b:true}
  {a:null,b:false}
  {a:null,b:null}
  {a:null}
  {a:null,b:"foo"}
  "=== MISSING ==="
  {b:true}
  {b:false}
  {b:null}
  {}
  {b:"foo"}
  "=== ERROR ==="
  {a:"foo",b:true}
  {a:"foo",b:false}
  {a:"foo",b:null}
  {a:"foo"}
  {a:"foo",b:"foo"}
  "=== UNION ==="
  {a:true::(bool|null),b:false::(bool|null)}
  {a:true::(bool|null),b:null::(bool|null)}

output: |
  "=== TRUE ==="
  true
  false
  null
  error("no such field b")
  error({message:"not type bool",on:"foo"})
  "=== FALSE ==="
  false
  false
  false
  false
  false
  "=== NULL ==="
  null
  false
  null
  error("no such field b")
  error({message:"not type bool",on:"foo"})
  "=== MISSING ==="
  error("no such field a")
  false
  error("no such field a")
  error("no such field a")
  error("no such field a")
  "=== ERROR ==="
  error({message:"not type bool",on:"foo"})
  false
  error({message:"not type bool",on:"foo"})
  error({message:"not type bool",on:"foo"})
  error({message:"not type bool",on:"foo"})
  "=== UNION ==="
  false
  null
