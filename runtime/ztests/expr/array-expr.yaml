spq: values [a,b,c]

input: |
  {a:error("missing"),b:error(0),c:null}
  {a:[1,2],b:null,c:[3,4]}
  {a:[1,"foo"],b:[2,"bar"],c:[3,"baz"]}
  {a:set[1,2],b:null,c:set[3,4]}
  {a:map{"key":"k1"},b:null,c:map{"key":"k3"}}
  // heterogenous
  {a:"foo",b:1,c:127.0.0.1}
  {a:"bar",b:2,c:127.0.0.2}
  {a:0,b:"1"::(int64|string),c:null::(int64|string|null)}
  {a:0,b:1,c:super([2]::(null|[int64]),<[int64]>)}

output: |
  [error("missing"),error(0),null]
  [[1,2],null,[3,4]]
  [[1,"foo"],[2,"bar"],[3,"baz"]]
  [set[1,2],null,set[3,4]]
  [map{"key":"k1"},null,map{"key":"k3"}]
  ["foo",1,127.0.0.1]
  ["bar",2,127.0.0.2]
  [0,"1",null]
  [0,1,[2]]

---

# Test empty array expression.
spq: values []

output: |
  []
