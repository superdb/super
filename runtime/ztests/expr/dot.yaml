spq: values a.b

flags: -dynamic

input: |
  {a:{b:1}}
  {a:{b:1::(int64|string)}}
  {a:{b:1}::(int64|{b:int64})}
  {a:{b:1}}::(int64|{a:{b:int64}})
  {a:fusion({b:1}::(null|{b:int64}),<{b:int64}>)}
  {a:fusion(null::(null|{b:int64}),<null>)}
  {a:{b?:none::option(int64|string)}}
  {a:1}
  {}
  null

output: |
  1
  1::(int64|string)
  1
  1
  1
  error("cannot access field 'b' of null")
  none::option(int64|string)
  error("cannot access field 'b' of int64")
  error("no such field a")
  error("cannot access field 'a' of null")

---

spq: 'values {x?:a.b}'

input: |
  {a:{b?:1}}
  {a:{b?:none::int64}}

output: |
  {x?:1}
  {x?:none::int64}
