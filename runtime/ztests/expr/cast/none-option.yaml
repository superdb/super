# Casting the singleton none to an option type yields the option's none
# and casting none to a non-option type T is shorthand for option(T).
spq: |
  values
    cast(none,<option(int64)>),
    [1,none],
    [1,none]::[option(int64)],
    -- [1,none::int64]::[option(int64)], -- this one is problematic... need to fix cast
    {a:[none,1]}::{a:[option(int64)]},
    none::int64,
    none::option(int64),
    none::(int64|string),
    typeof([]),
    typeof(set[]),
    typeof(map{}),
    missing ?? 123 -- this is missing because ?? doesn't do missing and missings shouldn't really happen


output: |
  none::int64
  [1]
  [some(1)]
  {a:[some(1)]}
  none::int64
  none::int64
  none::option(int64|string)
  <[none]>
  <set[none]>
  <map{none:none}>
  missing

---

spq: values none ?? 1

output: |
  1

---

spq: values [1,none,2] | values this[1]+1

output: |
  3

---

spq: values {a:none},{a:1} | sort a

output: |
  {a:1}
  {}
