# Casting a record without a field, or whose field is absent (has type
# none), to a record whose field has an option type yields the option's none.
spq: values cast(this, <{a:option(int64)}>)

input: |
  {a:1::(int64|none)}
  {a:none::(int64|none)}
  {b:2}

output: |
  {a?:1}
  {a?:none::int64}
  {a?:none::int64}
