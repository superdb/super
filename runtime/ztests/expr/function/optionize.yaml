spq: values optionize(this)

input: |
  <int64>
  <int64|string>
  <int64|none>
  <none|int64|string>
  <none|none|option(int64)|string>
  <none|option(int64|string)|ip>
  <none|none>
  <{a:int64|none,b:string}>
  <[{a:none|string}]>
  <set[none|int64]>
  <map{string:none|ip}>
  <error({a:none|int64})>
  <option({a:none|int64})>
  <{a:int64|none}|string>
  <none|{a:int64|none}>
  type foo={a:int64|none}
  <foo>
  <[foo]>
  1
  null
  error("bad")

output: |
  <int64>
  <int64|string>
  <option(int64)>
  <option(int64|string)>
  <option(int64|string)>
  <option(int64|string|ip)>
  <none|none>
  <{a?:int64,b:string}>
  <[{a?:string}]>
  <set[option(int64)]>
  <map{string:option(ip)}>
  <error({a?:int64})>
  <option({a?:int64})>
  <string|{a?:int64}>
  <option({a?:int64})>
  type foo={a:int64|none}
  <foo>
  <[foo]>
  error({message:"optionize: argument is not a type",on:1})
  null
  error({message:"optionize: error value encountered",on:error("bad")})

---

# A null member of the type of a record field is treated like missing so the
# field becomes optional, except that null is kept if it's the field's only
# type (so null stays null and none|null becomes option(null)).  A null in
# a union that isn't a field's type is left as is.
spq: values optionize(this)

input: |
  <{a:null|int64}>
  <{a:none|null|int64}>
  <{a:none|null|int64|string}>
  <{a:null}>
  <{a:none|null}>
  <{a:{b:null|string}}>
  <{a:[int64|null]}>
  <int64|null>
  <[{a:null|int64}]>

output: |
  <{a?:int64}>
  <{a?:int64}>
  <{a?:int64|string}>
  <{a:null}>
  <{a?:null}>
  <{a:{b?:string}}>
  <{a:[int64|null]}>
  <int64|null>
  <[{a?:int64}]>
