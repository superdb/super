spq: values compare(a, b)

input: |
  {a:2,b:1}
  {a:2,b:"1"}
  {a:null,b:2}
  {a:0,b:0.}
  {a:2::(int64|null),b:1::(int64|null)}
  {a:null::(int64|null),b:1::(int64|null)}
  {a:0}
  {b:0}
  {a:NaN,b:+Inf}
  {a:1,b:NaN}
  {a:NaN,b:NaN}

output: |
  1
  -1
  1
  0
  1
  1
  error("no such field b")
  error("no such field a")
  1
  -1
  0

---

spq: |
  values compare(a, b, true),
         compare(a, b, false),
         compare(a, b, "error")

input: |
  {a:null,b:2}
  {a:null::(int64|null),b:2}
  {a:null::(int64|null),b:2::(int64|null)}

output: |
  1
  -1
  error({message:"compare: nullsMax arg is not bool",on:"error"})
  1
  -1
  error({message:"compare: nullsMax arg is not bool",on:"error"})
  1
  -1
  error({message:"compare: nullsMax arg is not bool",on:"error"})
