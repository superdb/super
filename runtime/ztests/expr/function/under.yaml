spq: under(this)

input: |
  null
  0x1234
  error(null)
  error("foo")
  {}
  [1,2,3]
  type array=[int8]
  [1,2,3]::array
  type port=uint16
  80::port
  "foo"::(int64|string)
  1::(int64|string)
  type rec={s:string}
  <rec>
  some(1)
  none::int64

output: |
  null
  0x1234
  null
  "foo"
  {}
  [1,2,3]
  [1::int8,2::int8,3::int8]
  80::uint16
  "foo"
  1
  <{s:string}>
  1
  error("none not handled (consider ?? or ?.)")

---

# A type value is unwrapped one level.
spq: under(this)

input: |
  type arr=[int8]
  <arr>
  <[int64]>
  <set[ip]>
  <int64|string>
  <map{string:[int64]}>
  <{a:int64}>
  <int64>
  <option(int64)>
  <error({msg:string})>

output: |
  <[int8]>
  <int64>
  <ip>
  [<int64>,<string>]
  {key:<string>,value:<[int64]>}
  <{a:int64}>
  <int64>
  <int64>
  <{msg:string}>

---

# A fusion type value (e.g., from supertypeof) is unwrapped to its supertype.
spq: superfuse | values under(supertypeof(a))

input: |
  {a:1}
  {a:"x"}

output: |
  <int64|string>
  <int64|string>

---

# A named union (e.g., a sum type of named types) is unwrapped one level, so
# its values keep their member types until they're unwrapped again.
spq: values under(this), under(under(this)), under(under(under(this)))

input: |
  type Bar={x:int64}
  type Baz={y:string}
  type Foo=(Bar|Baz)
  {x:1}::Bar::Foo
  {y:"a"}::Baz::Foo

output: |
  type Bar={x:int64}
  type Baz={y:string}
  {x:1}::Bar::(Bar|Baz)
  {x:1}::Bar
  {x:1}
  {y:"a"}::Baz::(Bar|Baz)
  {y:"a"}::Baz
  {y:"a"}
