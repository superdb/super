spq: values {v:this.ok()}

input: |
  1
  [3,2,1,0]
  "s"::(string|null)
  error("baz")
  type foo=error(string)
  error("baz")::foo
  type bar=string
  error("baz"::bar)
  null
  error(null)
  error("quiet")
  error({x:"baz"})

output: |
  {v:1}
  {v:[3,2,1,0]}
  {v:"s"::(string|null)}
  {}
  {}
  {}
  {v:null}
  {}
  {}
  {}

---

spq: values {v:x.ok()}

input: |
  {x:1}
  {y:1}

output: |
  {v:1}
  {}

---

spq: cut a:=x.ok(),b:=x

flags: -dynamic

input: |
  {x:1}
  {y:1}

output: |
  {a:1,b:1}
  {b:error("no such field x")}

---

spq: cut a:=x.ok()::option(int64),b:=x

flags: -dynamic

input: |
  {x:1}
  {y:1}

output: |
  {a?:1,b:1}
  {a?:none::int64,b:error("no such field x")}

