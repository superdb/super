spq: concat(a, b, c)

input: |
  {a:"hello",b:" ",c:"world"}
  {a:null,b:null,c:null}
  {a:null,b:"b",c:null}
  {a:"a",b:null,c:"c"}
  {a:"hello"::(string|null),b:" "::(string|null),c:"world"::(string|null)}
  {a:null::(string|null),b:"b"::(string|null),c:null::(string|null)}
  {a:"a",b:2,c:error(0)}
  {a:"a",b:error(0),c:3}

output: |
  "hello world"
  ""
  "b"
  "ac"
  "hello world"
  "b"
  error({message:"concat: string arg required",on:2})
  error(0)

---

spq: concat(this)

input: |
  "single"
  null
  "hello"::(string|null)
  null::(string|null)
  1
  error(0)

output: |
  "single"
  ""
  "hello"
  ""
  error({message:"concat: string arg required",on:1})
  error(0)

---

spq: concat()

error: |
  too few arguments at line 1, column 1:
  concat()
  ~~~~~~~~

---

spq: values concat(this, "!"), this || "?"

input: |
  type name=string
  "hello"::name

output: |
  "hello!"
  "hello?"
