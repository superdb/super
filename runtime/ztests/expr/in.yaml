spq: |
  values this in [{a:1},[2],set[3],map{4:4},"b"::enum(b,c)]

input: |
  {a:1}
  {a:2}
  [2]
  [3]
  set[3]
  set[4]
  map{4:4}
  map{4:5}
  "b"::enum(b,c)
  "b"::enum(b,d)
  [{a:1},[2],set[3],map{4:4},"b"::enum(b,c)]
  fusion([fusion(2::(int64|{a:int64}),<int64>)],<[int64]>)

output: |
  true
  false
  true
  false
  true
  false
  true
  false
  true
  false
  true
  true

---

# Test in expressions on a map constant.
spq: |
  const m = map{"a":1,"b":2}
  values {b1: x in m,b2: "a" in a}

flags: -dynamic

input: |
  {x:"a"}
  {x:1}
  {x:10}
  {y:1}
  {a:map{"a":"hello"}}

output: |
  {b1:true,b2:error({message:"'in' operator: error value encountered",on:error("no such field a")})}
  {b1:true,b2:error({message:"'in' operator: error value encountered",on:error("no such field a")})}
  {b1:false,b2:error({message:"'in' operator: error value encountered",on:error("no such field a")})}
  {b1:error({message:"'in' operator: error value encountered",on:error("no such field x")}),b2:error({message:"'in' operator: error value encountered",on:error("no such field a")})}
  {b1:error({message:"'in' operator: error value encountered",on:error("no such field x")}),b2:true}
