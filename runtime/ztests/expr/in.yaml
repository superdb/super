spq: |
  values [1 in this, 9 in this, null in this]

input: |
  1
  {a:1}
  {c0:null,c1:9}
  [0,1,2]
  [0,null,1]
  [0,[1,2],3]
  [0,[1,null],3]
  set[0,1,2]
  map{1:null}
  map{null:1}
  1::(int64|string)
  {a:[0,1]::[int64|string]}
  null
  [error({message:"'in' operator: error value encountered",on:error(0)}),error({message:"'in' operator: error value encountered",on:error(0)}),error({message:"'in' operator: error value encountered",on:error(0)})]
  [error(0),error(1)]
  [error(0),null]

output: |
  [true,false,null]
  [true,false,null]
  [null,true,null]
  [true,false,null]
  [true,null,null]
  [true,false,null]
  [true,null,null]
  [true,false,null]
  [true,null,null]
  [true,null,null]
  [true,false,null]
  [true,false,null]
  [null,null,null]
  [false,false,null]
  [true,false,null]
  [null,null,null]

