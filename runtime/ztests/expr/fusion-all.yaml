spq: upcast(this,<any>)

flags: -fusion

# note: the syntax for fusion values will change from bytes to values soon
# and this test will be updated

input: |
  1
  "foo"
  {x:1}
  <string>

output: |
  1::any
  "foo"::any
  {x:1}::any
  <string>::any

---

spq: superdefuse(this::any)

input: &input |
  1
  "foo"
  {x:1}
  <string>

output: *input
