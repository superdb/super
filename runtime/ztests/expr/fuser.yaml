---

spq: superfuse

flags: -fusion

input: |
  {x:true}
  {}
  {x?:1}
  {x:2}

output: |
  {x:fusion(true::(int64|bool|missing|option(int64)),<bool>)}
  {x:fusion(missing::(int64|bool|missing|option(int64)),<missing>)}
  {x:fusion(some(1)::(int64|bool|missing|option(int64)),<option(int64)>)}
  {x:fusion(some(2)::(int64|bool|missing|option(int64)),<int64>)}

---

spq: superfuse | values x

flags: -fusion -dynamic

input: |
  {x:true}
  {}
  {x?:1}
  {x:2}

output: |
  fusion(true::(int64|bool|missing|option(int64)),<bool>)
  error("no such field x")
  fusion(some(1)::(int64|bool|missing|option(int64)),<option(int64)>)
  fusion(some(2)::(int64|bool|missing|option(int64)),<int64>)

---

spq: superfuse

flags: -fusion

input: |
  {x:1}
  {x?:2}

# note no fusion on outer record
output: |
  {x:fusion(some(1)::(int64|option(int64)),<int64>)}
  {x:fusion(some(2)::(int64|option(int64)),<option(int64)>)}
