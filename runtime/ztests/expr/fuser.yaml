---

spq: superfuse

flags: -superfused

input: |
  {x:true}
  {}
  {x?:1}
  {x:2}

output: |
  {x:super(true::(int64|bool|missing|option(int64)),<bool>)}
  {x:super(missing::(int64|bool|missing|option(int64)),<missing>)}
  {x:super(some(1)::(int64|bool|missing|option(int64)),<option(int64)>)}
  {x:super(some(2)::(int64|bool|missing|option(int64)),<int64>)}

---

spq: superfuse | values x

flags: -superfused -dynamic

input: |
  {x:true}
  {}
  {x?:1}
  {x:2}

output: |
  super(true::(int64|bool|missing|option(int64)),<bool>)
  error("no such field x")
  super(some(1)::(int64|bool|missing|option(int64)),<option(int64)>)
  super(some(2)::(int64|bool|missing|option(int64)),<int64>)

---

spq: superfuse

flags: -superfused

input: |
  {x:1}
  {x?:2}

# note no super on outer record
output: |
  {x:super(some(1)::(int64|option(int64)),<int64>)}
  {x:super(some(2)::(int64|option(int64)),<option(int64)>)}
