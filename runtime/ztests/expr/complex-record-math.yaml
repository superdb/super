---

spq: cut r:={x:a+(b.ok()??1000),y:a-(b.ok()??2000)},a1:=[a],a2:=[a+(b.ok()??3000),a-(b.ok()??4000)]

input: |
  {a:2,b:1}
  {a:4,b:3}
  {a:"hello"}
  {a:6,b:5}
  {a:2::(int64|null),b:1::(int64|null)}

output: |
  {r:{x:3,y:1},a1:[2],a2:[3,1]}
  {r:{x:7,y:1},a1:[4],a2:[7,1]}
  {r:{x:error("incompatible types"),y:error("incompatible types")},a1:["hello"],a2:[error("incompatible types"),error("incompatible types")]}
  {r:{x:11,y:1},a1:[6],a2:[11,1]}
