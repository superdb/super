# Records and maps are equal when their fields or entries are equal by value,
# and they have no order.
spq: values [a<b, a<=b, a==b, a!=b, a>=b, a>b]

flags: -dynamic

input: |
  {a:{x:1,y:"a"},b:{x:1,y:"a"}}
  {a:{x:1},b:{x:2}}
  {a:{x:1},b:{x:1.}}
  {a:map{1:2},b:map{1:3}}
  {a:map{1:2},b:map{1.:2.}}

output: |
  [false,true,true,false,true,false]
  [false,false,false,true,false,false]
  [false,true,true,false,true,false]
  [false,false,false,true,false,false]
  [false,true,true,false,true,false]

---

# Values that are equal but encoded differently (0.0 and -0.0) are equal, as
# are NaNs, as at the top level.
spq: |
  values
    {x:0.0} == {x:0.0*-1.0},
    map{1:0.0} == map{1:0.0*-1.0},
    {x:0.0/0.0} == {x:-(0.0/0.0)},
    map{1:0.0/0.0} == map{1:-(0.0/0.0)}

output: |
  true
  true
  true
  true
