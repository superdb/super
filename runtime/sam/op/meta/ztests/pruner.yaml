# This test makes sure the type context from metadata processing doesn't
# leak into the flowgraph, except for metaqueries, where it should.
script: |
  export SUPER_DB=test
  super db init -q
  super db create -q -orderby k:asc tmp
  super db use -q tmp
  seq 10 15 | super -c '{k:this}' - | super db load -q -
  seq 8 12 | super -c '{k:this}' - | super db load -q -
  seq 20 25 | super -c '{k:this}' - | super db load -q -
  seq 14 16 | super -c '{k:this}' - | super db load -q -
  super db -c "from tmp:objects (tap true) | k > 18" | super -s -c "drop id | min:=defuse(min),max:=defuse(max)" -
  echo ===
  super db -c "from tmp:objects (tap true) | k <= 10" | super -s -c "drop id | min:=defuse(min),max:=defuse(max)" -
  echo ===
  super db -c "from tmp:objects (tap true) | k >= 15 and k < 20" | super -s -c "drop id | min:=defuse(min),max:=defuse(max)" -
  echo ===
  super db -c "from tmp:objects (tap true) | k <= 9 or k > 24" | super -s -c "drop id | min:=defuse(min),max:=defuse(max)" -
  echo ===
  super db -c 'from tmp:objects (tap true) | a[k] == "foo" or k >= 20' | super -s -c "drop id | min:=defuse(min),max:=defuse(max)" -
  echo ===
  super db -c 'from tmp:objects (tap true) | a[k] == "foo" and k >= 20' | super -s -c "drop id | min:=defuse(min),max:=defuse(max)" -

outputs:
  - name: stdout
    data: |
      {min:20,max:25,count:6::uint64,size:635}
      ===
      {min:8,max:12,count:5::uint64,size:635}
      {min:10,max:15,count:6::uint64,size:635}
      ===
      {min:10,max:15,count:6::uint64,size:635}
      {min:14,max:16,count:3::uint64,size:635}
      ===
      {min:8,max:12,count:5::uint64,size:635}
      {min:20,max:25,count:6::uint64,size:635}
      ===
      {min:8,max:12,count:5::uint64,size:635}
      {min:10,max:15,count:6::uint64,size:635}
      {min:14,max:16,count:3::uint64,size:635}
      {min:20,max:25,count:6::uint64,size:635}
      ===
      {min:20,max:25,count:6::uint64,size:635}
