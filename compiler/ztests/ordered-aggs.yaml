script: |
  echo === array_agg
  super compile -C -P 2 'from /dev/null | array_agg(a)'
  echo === collect
  super compile -C -P 2 'from /dev/null | collect(a)'
  echo === array_agg and collect with an unordered aggregate
  super compile -C -P 2 'from /dev/null | array_agg(a),collect(a),count()'


outputs:
  - name: stdout
    data: |
      === array_agg
      file /dev/null fields a
      | aggregate
          array_agg:=array_agg(a)
      | values array_agg
      | output main
      === collect
      file /dev/null fields a
      | aggregate
          collect:=collect(a)
      | values collect
      | output main
      === array_agg and collect with an unordered aggregate
      file /dev/null fields a
      | aggregate
          array_agg:=array_agg(a),collect:=collect(a),count:=count()
      | output main
