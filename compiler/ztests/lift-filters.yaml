script: |
  super compile -C -O -dynamic 'from f | values {a:b,c:d} | where a==1 and c==2'
  echo ===
  super compile -C -O -dynamic 'from f | values {...a} | where b==1'
  echo ===
  super compile -C -O -dynamic 'from f | values {a:{b:c}} | where a.b==1'
  echo ===
  # https://github.com/superdb/super/issues/6223
  super compile -C -O -dynamic 'from f |values {a:b,c,d} | where a+1 between c and d'
  echo ===
  super compile -C -O -dynamic 'from f | values {a:{...b,...c}} | where a.d'

outputs:
  - name: stdout
    data: |
      file f project [b,d]
        meta-filter project [b.max,b.min,d.max,d.min] (
          compare(1, b.min, true)>=0 and compare(1, b.max, true)<=0 and compare(2, d.min, true)>=0 and compare(2, d.max, true)<=0
        )
        data-filter (
          b==1 and d==2
        )
      | where b==1 and d==2
      | values {a:b,c:d}
      | output main
      ===
      file f project [a]
        meta-filter project [a.b.max,a.b.min] (
          compare(1, a.b.min, true)>=0 and compare(1, a.b.max, true)<=0
        )
        data-filter project [a.b] (
          a.b==1
        )
      | where a.b==1
      | values {...a}
      | output main
      ===
      file f project [c]
        meta-filter project [c.max,c.min] (
          compare(1, c.min, true)>=0 and compare(1, c.max, true)<=0
        )
        data-filter (
          c==1
        )
      | where c==1
      | values {a:{b:c}}
      | output main
      ===
      file f project [b,c,d]
        data-filter (
          b+1>=c and b+1<=d
        )
      | where b+1>=c and b+1<=d
      | values {a:b,c:c,d:d}
      | output main
      ===
      file f project [b,c]
      | values {a:{...b,...c}}
      | where a.d
      | output main
