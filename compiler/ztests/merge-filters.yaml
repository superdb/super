script: |
  super compile -C -O 'from /dev/null | where a | where b'
  echo ===
  super compile -C -O -dynamic 'fork ( from /dev/null | where b | where c ) ( from /dev/zero | where e | where f ) | where g'
  echo ===
  super compile -C -O 'from /dev/null | unnest [a] into ( where b | where c )'
  echo ===
  super compile -C -O -dynamic 'from /dev/null | fork ( where a | where b ) ( where c | where d  )'

outputs:
  - name: stdout
    data: |
      file /dev/null
        data-filter project [a,b] (
          a and b
        )
      | where a and b
      | output main
      ===
      fork
        (
          file /dev/null unordered
            data-filter project [b,c,g] (
              b and c and g
            )
          | where b and c and g
        )
        (
          file /dev/zero unordered
            data-filter project [e,f,g] (
              e and f and g
            )
          | where e and f and g
        )
      | output main
      ===
      file /dev/null project [a]
      | unnest (
        -- correlated
        unnest [a]
        | where b and c
        | aggregate
            collect:=collect(this)
        | values collect)
      | output main
      ===
      file /dev/null unordered
      | fork
        (
          where a and b
          | output main
        )
        (
          where c and d
          | output main
        )
