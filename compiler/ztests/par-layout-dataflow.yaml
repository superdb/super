script: |
  super db init -q test
  super db attach -q test
  super db create -q -orderby ts:asc ASC
  super db create -q -orderby ts:desc DESC
  super db compile -C -P 2 "from ASC | cut x:=ts,ts:=1" | sed -e 's/table .*/.../'
  echo ===
  super db compile -C -P 2 "from DESC | cut x:=ts,ts:=1" | sed -e 's/table .*/.../'

outputs:
  - name: stdout
    data: |
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
          | values {x:ts,ts:1}
        )
        (
          seqscan ...
          | values {x:ts,ts:1}
        )
      | merge x asc nulls last
      | output main
      ===
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
          | values {x:ts,ts:1}
        )
        (
          seqscan ...
          | values {x:ts,ts:1}
        )
      | merge x desc nulls first
      | output main
