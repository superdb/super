script: |
  super -s -c "select a from s.json where a||b like '%os%'"
  echo ===
  super -s -c "select a from s.json where a||b not like '%os%'"
  echo ===
  super -s -c "from s.json | values a LIKE 'f%'"
  echo ===
  super -s -c "from s.json | values a NOT LIKE 'f%'"
  echo ===
  super -s -c "from s.json | values {exact:a LIKE 'foo', part:a LIKE 'oo', not_part:a NOT LIKE 'oo'}"

inputs:
  - name: s.json
    data: |
      {"a":"foo","b":"see"}
      {"a":"bar","b":"go"}

outputs:
  - name: stdout
    data: |
      {a:"foo"}
      ===
      {a:"bar"}
      ===
      true
      false
      ===
      false
      true
      ===
      {exact:true,part:false,not_part:true}
      {exact:false,part:false,not_part:true}
