spq: SELECT * FROM (VALUES (1,2)) t1, (VALUES (3,4)) t2 CROSS JOIN (VALUES (5,6)) t3

output: |
  {column1:1,column2:2,column1_1:3,column2_1:4,column1_2:5,column2_2:6}

