script: |
  super db init -q test
  super db attach -q test
  super db create -q -orderby ts test
  echo "<CUT PUT RENAME>"
  super db compile -C -P 2 "from test | cut ts, y, z | put x := y | rename y := z" | sed -e 's/table .*/.../'
  echo "<CUT UNIQ>"
  super db compile -C -P 2  "from test | cut ts, foo:=x | uniq" | sed -e 's/table .*/.../'
  echo "<DROP UNIQ>"
  super db compile -C -P 2 "from test | drop x | uniq" | sed -e 's/table .*/.../'
  echo "<BUCKET COUNT>"
  super db compile -C -P 2 "from test | count() by y, ts:=bucket(ts, 1h)" | sed -e 's/table .*/.../'
  echo "<PUT COUNTDISTINCT UNIQ>"
  super db compile -C -P 2  "from test | put x:=y | countdistinct(x) by y | uniq" | sed -e 's/table .*/.../'
  echo "<RENAME UNIQ>"
  super db compile -C -P 2  "from test | put x:=foo | rename foo:=boo | uniq" | sed -e 's/table .*/.../'
  echo "<PUT TAIL>"
  super db compile -C -P 2 "from test | put a:=1 | tail" | sed -e 's/table .*/.../'
  echo "<SORT UNIQ>"
  super db compile -C -P 2 "from test | sort | uniq" | sed -e 's/table .*/.../'
  echo "<SORT X UNIQ>"
  super db compile -C -P 2 "from test | sort x | uniq" | sed -e 's/table .*/.../'
  echo "<UNIQ>"
  super db compile -C -P 2 "from test | uniq" | sed -e 's/table .*/.../'

outputs:
  - name: stdout
    data: |
      <CUT PUT RENAME>
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
          | values {ts:ts,y:y,z:z}
          | put x:=y
          | rename y:=z
        )
        (
          seqscan ...
          | values {ts:ts,y:y,z:z}
          | put x:=y
          | rename y:=z
        )
      | merge ts asc nulls last
      | output main
      <CUT UNIQ>
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
          | values {ts:ts,foo:x}
        )
        (
          seqscan ...
          | values {ts:ts,foo:x}
        )
      | merge ts asc nulls last
      | uniq
      | output main
      <DROP UNIQ>
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
          | drop x
        )
        (
          seqscan ...
          | drop x
        )
      | merge ts asc nulls last
      | uniq
      | output main
      <BUCKET COUNT>
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
          | aggregate partials-out
              count:=count() by y:=y,ts:=bucket(ts, 1h)
        )
        (
          seqscan ...
          | aggregate partials-out
              count:=count() by y:=y,ts:=bucket(ts, 1h)
        )
      | merge ts asc nulls last
      | aggregate partials-in
          count:=count() by y:=y,ts:=ts
      | output main
      <PUT COUNTDISTINCT UNIQ>
      lister ...
      | scatter
        (
          seqscan ...
          | put x:=y
          | aggregate partials-out
              countdistinct:=countdistinct(x) by y:=y
        )
        (
          seqscan ...
          | put x:=y
          | aggregate partials-out
              countdistinct:=countdistinct(x) by y:=y
        )
      | combine
      | aggregate partials-in
          countdistinct:=countdistinct(x) by y:=y
      | uniq
      | output main
      <RENAME UNIQ>
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
          | put x:=foo
          | rename foo:=boo
        )
        (
          seqscan ...
          | put x:=foo
          | rename foo:=boo
        )
      | merge ts asc nulls last
      | uniq
      | output main
      <PUT TAIL>
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
          | put a:=1
          | tail 1
        )
        (
          seqscan ...
          | put a:=1
          | tail 1
        )
      | merge ts asc nulls last
      | tail 1
      | output main
      <SORT UNIQ>
      lister ...
      | scatter
        (
          seqscan ...
        )
        (
          seqscan ...
        )
      | combine
      | sort
      | uniq
      | output main
      <SORT X UNIQ>
      lister ...
      | scatter
        (
          seqscan ...
          | sort x asc nulls last
        )
        (
          seqscan ...
          | sort x asc nulls last
        )
      | merge x asc nulls last
      | uniq
      | output main
      <UNIQ>
      lister ...
      | slicer
      | scatter
        (
          seqscan ...
        )
        (
          seqscan ...
        )
      | merge ts asc nulls last
      | uniq
      | output main
