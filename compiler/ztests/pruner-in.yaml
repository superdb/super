script: |
  super compile -C -O -dynamic 'from test.bsup | x in ["foo","bar"]'
  echo // ===
  # Test that we still optimize for a tuple which gets translated into a record.
  super compile -C -O -dynamic 'from test.bsup | x in ("foo","bar")'

outputs:
  - name: stdout
    data: |
      file test.bsup format bsup
        meta-filter project [x.max,x.min] (
          compare("foo", x.min, true)>=0 and compare("foo", x.max, true)<=0 or compare("bar", x.min, true)>=0 and compare("bar", x.max, true)<=0
        )
        data-filter project [x] (
          x in ["foo","bar"]
        )
      | where x in ["foo","bar"]
      | output main
      // ===
      file test.bsup format bsup
        meta-filter project [x.max,x.min] (
          compare("foo", x.min, true)>=0 and compare("foo", x.max, true)<=0 or compare("bar", x.min, true)>=0 and compare("bar", x.max, true)<=0
        )
        data-filter project [x] (
          x in {c0:"foo",c1:"bar"}
        )
      | where x in {c0:"foo",c1:"bar"}
      | output main
