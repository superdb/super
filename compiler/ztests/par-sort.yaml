script: |
  super compile -C -P 2 -dynamic 'from test.bsup | sort a, b desc nulls last | values c'

outputs:
  - name: stdout
    data: |
      file test.bsup format bsup unordered project [a,b,c]
      | scatter
        (
          sort a asc nulls last, b desc nulls last
        )
        (
          sort a asc nulls last, b desc nulls last
        )
      | merge a asc nulls last, b desc nulls last
      | values c
      | output main
