script: |
  super compile -C -dag 'values {x:1} | cut x'
  ! super compile -C -dag 'cut x'
  ! super compile -C -dag 'values {x:1} | cut x,y'
  ! super compile -C -dag 'values {x:1} | cut this[x]:=1'


outputs:
  - name: stdout
    data: |
      null
      | values {x:1}
      | values {x:x}
      | output main
  - name: stderr
    data: |
      no such field "x": . applied to null at line 1, column 5:
      cut x
          ~
      no such field "y" at line 1, column 22:
      values {x:1} | cut x,y
                           ~
      cut requires static field names at line 1, column 20:
      values {x:1} | cut this[x]:=1
                         ~~~~~~~~~~
