script: |
  echo === debug
  super compile -C -O 'from /dev/null | debug a | values b'
  echo === distinct
  super compile -C -O 'from /dev/null | distinct a | values b'
  echo === fork into hash join
  super compile -C -O -dynamic 'fork ( from /dev/null ) ( from /dev/zero ) | join on right.a=left.b | values left.c,right.d'
  echo === fork into nested loop join
  super compile -C -O -dynamic 'fork ( from /dev/null ) ( from /dev/zero ) | join on right.a>left.b | values left.c,right.d'
  echo === hash join
  super compile -C -O -dynamic "from /dev/null | join (from /dev/zero) on left.a=right.b | values left.c,right.d"
  echo === nested loop join
  super compile -C -O -dynamic "from /dev/null | join (from /dev/zero) on left.a>right.b | values left.c,right.d"
  echo === switch into hash join
  super compile -C -O 'from /dev/null | switch a case b ( put x:=c ) case d ( put x:=e ) | join on left.f=right.g | values left.h,right.i'
  echo === switch into nested loop join
  super compile -C -O 'from /dev/null | switch a case b ( put x:=c ) case d ( put x:=e ) | join on left.f>right.g | values left.h,right.i'
  echo === where
  super compile -C -O "from /dev/null | a==1 or e==2 | values c, b, d"
  echo ===
  export SUPER_DB=test
  super db init -q
  super db create -q -orderby ts pool-ts
  scrub() { sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/xxx/g'; }
  super db compile -C -O "from 'pool-ts' | x=='hello' or x==1.0 | values a" | scrub
  echo ===
  super db compile -C -O "from 'pool-ts' | x > 1 and y <= 1.0" | scrub
  echo ===
  super db compile -C -O "from 'pool-ts' | x=='hello' or x!=1.0" | scrub
  echo ===
  super db compile -C -O "from 'pool-ts' | x=='hello' or !(y==2 or y==3)" | scrub
  echo ===
  super db compile -C -O "from 'pool-ts' | ts >= 0 and ts <= 2" | scrub
  echo ===
  super db compile -C -O "from 'pool-ts' | ts >= 0 and ts <= 2 and x=='hello'" | scrub

outputs:
  - name: stdout
    data: |
      === debug
      file /dev/null project [a,b]
      | debug a
      | values b
      | output main
      === distinct
      file /dev/null unordered project [a,b]
      | distinct a
      | values b
      | output main
      === fork into hash join
      fork
        (
          file /dev/null unordered project [b,c]
        )
        (
          file /dev/zero unordered project [a,d]
        )
      | inner hashjoin as {left,right} on b==a
      | values left.c, right.d
      | output main
      === fork into nested loop join
      fork
        (
          file /dev/null unordered project [b,c]
        )
        (
          file /dev/zero unordered project [a,d]
        )
      | inner join as {left,right} on right.a>left.b
      | values left.c, right.d
      | output main
      === hash join
      fork
        (
          file /dev/null unordered project [a,c]
        )
        (
          file /dev/zero unordered project [b,d]
        )
      | inner hashjoin as {left,right} on a==b
      | values left.c, right.d
      | output main
      === nested loop join
      fork
        (
          file /dev/null unordered project [a,c]
        )
        (
          file /dev/zero unordered project [b,d]
        )
      | inner join as {left,right} on left.a>right.b
      | values left.c, right.d
      | output main
      === switch into hash join
      file /dev/null unordered project [a,b,c,d,e,f,g,h,i]
      | switch a
        case b (
          put x:=c
        )
        case d (
          put x:=e
        )
      | inner hashjoin as {left,right} on f==g
      | values left.h, right.i
      | output main
      === switch into nested loop join
      file /dev/null unordered project [a,b,c,d,e,f,g,h,i]
      | switch a
        case b (
          put x:=c
        )
        case d (
          put x:=e
        )
      | inner join as {left,right} on left.f>right.g
      | values left.h, right.i
      | output main
      === where
      file /dev/null project [a,b,c,d,e]
        meta-filter project [a.max,a.min,e.max,e.min] (
          compare(1, a.min, true)>=0 and compare(1, a.max, true)<=0 or compare(2, e.min, true)>=0 and compare(2, e.max, true)<=0
        )
        data-filter project [a,e] (
          a==1 or e==2
        )
      | where a==1 or e==2
      | values c, b, d
      | output main
      ===
      lister pool xxx commit xxx
      | slicer
      | seqscan pool xxx project [a,x] filter (x=="hello" or x==1.)
      | values a
      | output main
      ===
      lister pool xxx commit xxx
      | slicer
      | seqscan pool xxx filter (x>1 and y<=1.)
      | output main
      ===
      lister pool xxx commit xxx
      | slicer
      | seqscan pool xxx filter (x=="hello" or x!=1.)
      | output main
      ===
      lister pool xxx commit xxx
      | slicer
      | seqscan pool xxx filter (x=="hello" or !(y==2 or y==3))
      | output main
      ===
      lister pool xxx commit xxx pruner (compare(0, defuse(max), true)>0 or compare(2, defuse(min), true)<0)
      | slicer
      | seqscan pool xxx pruner (compare(0, defuse(max), true)>0 or compare(2, defuse(min), true)<0) filter (ts>=0 and ts<=2)
      | output main
      ===
      lister pool xxx commit xxx pruner (compare(0, defuse(max), true)>0 or compare(2, defuse(min), true)<0)
      | slicer
      | seqscan pool xxx pruner (compare(0, defuse(max), true)>0 or compare(2, defuse(min), true)<0) filter (ts>=0 and ts<=2 and x=="hello")
      | output main
