script: |
  super db init -q test
  super db attach -q test
  super db create -q -orderby s:asc test
  super db compile -P 2 -C "from test | union(s) by n:=len(s)" | sed -e 's/table .*/.../'
  echo ===
  super compile -C -P 2 -dynamic 'from test.bsup | summarize count(a) by b'

outputs:
  - name: stdout
    data: |
      lister ...
      | scatter
        (
          seqscan ...
          | aggregate partials-out
              union:=union(s) by n:=len(s)
        )
        (
          seqscan ...
          | aggregate partials-out
              union:=union(s) by n:=len(s)
        )
      | combine
      | aggregate partials-in
          union:=union(s) by n:=this?.n
      | output main
      ===
      file test.bsup format bsup unordered project [a,b]
      | scatter
        (
          aggregate partials-out
              count:=count(a) by b:=b
        )
        (
          aggregate partials-out
              count:=count(a) by b:=b
        )
      | combine
      | aggregate partials-in
          count:=count(a) by b:=this?.b
      | output main
