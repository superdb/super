# Paths referenced only as the argument to typeof() or kind(), possibly
# through under(), are projected for their types only (shown as typeof(path)
# in the projection).
# A field of either is projected for the type of the path.
# Operators that materialize the values they pass through (e.g., sort and
# uniq) need all of the data of the fields that reach them, including those
# demanded only for their types upstream or on another path, but not past an
# operator that makes new values (e.g., aggregate).
# The fuse and superfuse aggregate functions need only the types of their
# argument.
# A field assigned by put is not projected for its data, even when the type
# of the value is needed.
script: |
  super compile -C -O -dynamic 'from /dev/null | values typeof(this) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | values typeof(a), kind(b.c) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | count() by typeof(this) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | values {t:typeof(a),b:a.b} | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | values {t:typeof(a.b),a} | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | values typeof(a+1) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | count() by typeof(under(under(this))) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | values kind(under(a.b)) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | sort x | values typeof(a) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | uniq | values typeof(this) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | count() by typeof(under(under(this)).a) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | values kind(under(a.b).c) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | put t:=typeof(b) | sort a | values a, t | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | fork (sort a | values a) (values typeof(b)) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | count() by typeof(this) | sort this | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | fuse(this) | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | superfuse(a) by b | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | put x:=1 | values {t:typeof(this),v:x} | output main' | head -1
  super compile -C -O -dynamic 'from /dev/null | put a.b:=1 | values {t:typeof(this),v:a.b,w:a.c} | output main' | head -1

outputs:
  - name: stdout
    data: |
      file /dev/null project [typeof(this)]
      file /dev/null project [typeof(a),typeof(b.c)]
      file /dev/null unordered project [typeof(this)]
      file /dev/null project [a.b,typeof(a)]
      file /dev/null project [a]
      file /dev/null project [a]
      file /dev/null unordered project [typeof(this)]
      file /dev/null project [typeof(a.b)]
      file /dev/null unordered project [a,x]
      file /dev/null
      file /dev/null unordered project [typeof(this)]
      file /dev/null project [typeof(a.b)]
      file /dev/null unordered project [a,b]
      file /dev/null unordered project [a,b]
      file /dev/null unordered project [typeof(this)]
      file /dev/null unordered project [typeof(this)]
      file /dev/null unordered project [b,typeof(a)]
      file /dev/null project [typeof(this)]
      file /dev/null project [a.c,typeof(a),typeof(this)]
