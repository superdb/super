script: |
  super compile -C -dag -dynamic 'from /dev/null | ?foo | fork ( count() by x:=this["@foo"] ) ( sum(x) ) ( put a:=b*c ) | cut count,x | sort -r x'

outputs:
  - name: stdout
    data: |
      file /dev/null
      | where search("foo")
      | fork
        (
          aggregate
              count:=count() by x:=`@foo`
        )
        (
          aggregate
              sum:=sum(x)
          | values sum
        )
        (
          put a:=b*c
        )
      | cut count:=count,x:=x
      | sort x desc nulls last
      | output main
