script: |
  super -o test.bsup test.sup
  super -o test.json test.sup
  super -o test.parquet -c blend test.sup
  gzip -c test.sup > test.sup.gz
  gzip -c test.bsup > test.bsup.gz
  for format in bsup bsup.gz json parquet sup sup.gz; do
    echo "=== $format (default)"
    super compile -C -dag "from test.$format"
    super compile -C -dag pass test.$format
    echo "=== $format (static)"
    super compile -C -dag -static "from test.$format"
    super compile -C -dag -static pass test.$format
    echo "=== $format (default pipe)"
    cat test.$format | super compile -C -dag "from /dev/stdin"
    cat test.$format | super compile -C -dag pass /dev/stdin
    echo "=== $format (default redirect)"
    super compile -C -dag "from /dev/stdin" < test.$format
    echo "=== $format (static pipe)"
    cat test.$format | super compile -C -dag -static "from /dev/stdin"
    cat test.$format | super compile -C -dag -static pass /dev/stdin
  done

inputs:
  - name: test.sup
    data: |
      {x:1}
      {y:1}

outputs:
  - name: stdout
    data: |
      === bsup (default)
      file test.bsup format bsup type {x:fusion(int64|missing),y:fusion(int64|missing)}
