script: |
  super -o test.bsup test.sup
  super -o test.json test.sup
  super -o test.parquet -c blend test.sup
  for format in bsup json parquet sup; do
    echo "=== $format (default)"
    super compile -dag -C "from test.$format"
    echo "=== $format (static)"
    super compile -static -dag -C "from test.$format"
    echo "=== $format (default pipe)"
    cat "test.$format" | super compile -dag -C "from /dev/stdin"
    echo "=== $format (static pipe)"
    ! cat "test.$format" | super compile -static -dag -C "from /dev/stdin" 2>&1
  done

inputs:
  - name: test.sup
    data: |
      {x:1}
      {y:1}

outputs:
  - name: stdout
    data: |
      === bsup (default)
      file test.bsup format bsup type {x:fusion(int64|missing),y:fusion(int64|missing)}
      | output main
      === bsup (static)
      file test.bsup format bsup type {x:fusion(int64|missing),y:fusion(int64|missing)}
      | output main
      === bsup (default pipe)
      file /dev/stdin
      | output main
