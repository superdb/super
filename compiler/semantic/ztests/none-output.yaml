# ?. on an option none is a plain none, which disappears from a record,
# array, or map, or is handled with ??.  (The option none is a value.)
spq: values typeof(org?.id), {v:org?.id}, [org?.id], map{"v":org?.id}, org?.id ?? 0, org

input: |
  {org?:none::{id:int64}}
  {org?:{id:1}}

output: |
  <none>
  {}
  []
  map{}
  0
  none::{id:int64}
  <int64>
  {v:1}
  [1]
  map{"v":1}
  1
  some({id:1})

---

# A plain none (e.g., from ?. or ok()) output by the values operator is
# dropped, so it isn't passed downstream, unless it's handled
# with ??.
script: |
  super -o in.bsup in.sup
  echo ===
  super -s -c 'from in.bsup | values org?.id'
  echo ===
  super -s -c 'from in.bsup | values y.ok()'
  echo ===
  super -s -c 'from in.bsup | values y.ok() | values typeof(this)'
  echo ===
  super -s -c 'from in.bsup | y.ok()'
  echo ===
  super -s -c 'from in.bsup | values org?.id ?? 0, {y:y.ok()}'

inputs:
  - name: in.sup
    data: |
      {org?:none::{id:int64}}
      {org?:{id:1},y:2}

outputs:
  - name: stdout
    data: |
      ===
      1
      ===
      2
      ===
      <int64>
      ===
      2
      ===
      0
      {}
      1
      {y:2}

---

# At runtime, a plain none output is dropped.
spq: values org?.id

flags: -dynamic

input: |
  {org?:none::{id:int64}}
  {org?:{id:1}}

output: |
  1

---

# A none literal is a plain none, so it's dropped.
spq: values none, 1

output: |
  1

---

# A map entry whose value is a plain none disappears but an option none
# is kept.
spq: values map{"a":none,"b":1}, map{"a":none::int64}, map{"a":none}

output: |
  map{"b":1}
  map{"a":none::int64}
  map{}

---

# The result of an expression subquery may be none.
spq: values {v:(values y.ok())}, [(values y.ok())]

input: |
  {x:1}

output: |
  {}
  []

---

# A none of a named type is a value.
spq: type foo=none values none::foo

output: |
  type foo=none
  none::foo

---

# A union whose type has a none member keeps its type for values that
# aren't plain nones.
spq: values this

flags: -dynamic

input: |
  1::(int64|none)

output: |
  1::(int64|none)

---

# A none of a named type survives in a union and in a map.
spq: type foo=none values 1::(int64|foo), map{"a":none::foo}

output: |
  type foo=none
  1::(foo|int64)
  map{"a":none::foo}
