script: |
  echo === dag.FileScan
  super compile -C -dag -dynamic 'values (from "/dev/null")'
  echo === dag.HTTPScan
  super compile -C -dag 'values (from http://host)'
  echo === dag.RobotScan
  super compile -C -dag 'values (from f"{this}")'

  super db init -q test
  super db attach -q test
  super db create -q test
  echo === dag.CommitMetaScan
  super db compile -C -dag 'values (from test@main:objects)' | sed -Ee 's/[0-9a-f-]{36}/xxx/'
  echo === dag.DBMetaScan
  super db compile -C -dag 'values (from :tables)' | sed -Ee 's/[0-9a-f-]{36}/xxx/'
  echo === dag.TableMetaScan
  super db compile -C -dag 'values (from test:branches)' | sed -Ee 's/[0-9a-f-]{36}/xxx/'
  echo === dag.TableScan
  super db compile -C -dag 'values (from test)' | sed -Ee 's/[0-9a-f-]{36}/xxx/'

  echo === dag.ForkOp
  super compile -C -dag -dynamic 'values (fork (from "/dev/null") (from "/dev/null"))'
  super compile -C -dag -dynamic 'values (fork (from "/dev/null") (head))'
  super compile -C -dag 'values (fork (head) (head))'
  super compile -C -dag -dynamic 'values (fork (head) (from "/dev/null"))'
  echo === dag.SwitchOp
  super compile -C -dag -dynamic 'values (switch case true (from "/dev/null"))'


outputs:
  - name: stdout
    data: |
      === dag.FileScan
      let 0/subquery = materialized (
        file /dev/null
      )
      null
      | values materialized (
        materialized 0)
      | output main
      === dag.HTTPScan
      let 0/subquery = materialized (
        get http://host format auto
      )
      null
      | values materialized (
        materialized 0)
      | output main
      === dag.RobotScan
      null
      | values (
        robot cast(this, <string>))
      | output main
      === dag.CommitMetaScan
      let 0/subquery = materialized (
        table xxx@00000000-0000-0000-0000-000000000000:objects
      )
      null
      | values materialized (
        materialized 0)
      | output main
      === dag.DBMetaScan
      let 0/subquery = materialized (
        :tables
      )
      null
      | values materialized (
        materialized 0)
      | output main
      === dag.TableMetaScan
      let 0/subquery = materialized (
        table xxx:branches
      )
      null
      | values materialized (
        materialized 0)
      | output main
      === dag.TableScan
      let 0/subquery = materialized (
        table xxx
      )
      null
      | values materialized (
        materialized 0)
      | output main
      === dag.ForkOp
      let 0/subquery = materialized (
        fork
          (
            file /dev/null
          )
          (
            file /dev/null
          )
      )
      null
      | values materialized (
        materialized 0)
      | output main
      null
      | values (
        fork
          (
            file /dev/null
          )
          (
            head 1
          ))
      | output main
      null
      | values (
        fork
          (
            head 1
          )
          (
            head 1
          ))
      | output main
      null
      | values (
        fork
          (
            head 1
          )
          (
            file /dev/null
          ))
      | output main
      === dag.SwitchOp
      null
      | values (
        switch
          case true (
            file /dev/null
          ))
      | output main
