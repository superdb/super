script: |
  echo === dag.FileScan
  SUPER_FUSEINPUT=1 super compile -C -dag -dynamic 'from /dev/null'
  echo === dag.HttpScan
  SUPER_FUSEINPUT=1 super compile -C -dag 'from http://host'
  echo === dag.RobotScan
  SUPER_FUSEINPUT=1 super compile -C -dag 'from f"{this}"'
  echo === dag.TableScan
  super db init -q test
  super db attach -q test
  super db create -q table
  SUPER_FUSEINPUT=1 super db compile -C -dag 'from table' | sed -Ee 's/[0-9a-f-]{36}/xxx/'


outputs:
  - name: stdout
    data: |
      === dag.FileScan
      file /dev/null
      | fuse
      | output main
      === dag.HttpScan
      get http://host format auto
      | fuse
      | output main
      === dag.RobotScan
      null
      | robot cast(this, <string>)
      | fuse
      | output main
      === dag.TableScan
      table xxx
      | fuse
      | output main
