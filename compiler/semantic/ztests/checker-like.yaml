# LIKE and NOT LIKE require a string on the left-hand side.
spq: values 0x676f6f676c65 LIKE '%oo%', 1 NOT LIKE '1', {a:'google'} LIKE '%oo%', ['google'] LIKE '%oo%'

error: |
  expected type string at line 1, column 8:
  values 0x676f6f676c65 LIKE '%oo%', 1 NOT LIKE '1', {a:'google'} LIKE '%oo%', ['google'] LIKE '%oo%'
         ~~~~~~~~~~~~~~
