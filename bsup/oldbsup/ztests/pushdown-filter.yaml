# Test that union true values get de-unioned in filter pushdowns.
script: |
  super -f bsuprows in.sup > test.bsuprows 
  super -s -c 'from test.bsuprows | where this'

inputs:
  - name: in.sup
    data: |
      true::(bool|null)
      false::(bool|null)

outputs:
  - name: stdout
    data: |
      true::(bool|null)
