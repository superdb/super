# Test that type contexts are properly reset and reusable after stream boundaries

script: |
  super in.sup > s.bsuprows
  super in.sup >> s.bsuprows
  super -s s.bsuprows

inputs:
  - name: in.sup
    data: |
      {a:"hello"}
      {b:10}

outputs:
  - name: stdout
    data: |
      {a:"hello"}
      {b:10}
      {a:"hello"}
      {b:10}
