# Test that type names are properly reset and reusable after stream boundaries.
script: |
  super -c "head 1" in.sup > t1.bsuprows
  super -c "tail 2" in.sup > t2.bsuprows
  super -s -c "where proto.is_ok() | count() by proto" t1.bsuprows t2.bsuprows

inputs:
  - name: in.sup
    data: |
      {ts:2015-03-05T14:25:12.963801Z}
      type zenum=string
      {ts:2015-03-05T14:25:14.419939Z,proto:"udp"::zenum}
      {ts:2015-03-05T14:25:14.419939Z,proto:"udp"::zenum}

outputs:
  - name: stdout
    data: |
      type zenum=string
      {proto:"udp"::zenum,count:2}
