script: |
  super -o test.bsup -
  super dev vector project -s test.bsup x y z
  echo ===
  super dev vector project -s test.bsup s
  echo ===
  super dev vector project -s test.bsup x s
  echo ===
  super dev vector project -s test.bsup s x
  echo ===
  super dev vector project -s test.bsup y w.y
  echo ===
  echo '1 2 3' | super -o test2.bsup -
  super dev vector project -s test2.bsup x
inputs:
  - name: stdin
    data: |
      {x:1,y:2,s:"foo"}
      {x:3,y:4}
      {x:3,y:4,s:"bar"}
      {x:3,y:4}
      {s:"baz",w:{y:5}}
outputs:
  - name: stdout
    data: |
      {x:1,y:2,z:error("no such field z")}
      {x:3,y:4,z:error("no such field z")}
      {x:3,y:4,z:error("no such field z")}
      {x:3,y:4,z:error("no such field z")}
      {x:error("no such field x"),y:error("no such field y"),z:error("no such field z")}
      ===
      {s:"foo"}
      {s:error("no such field s")}
      {s:"bar"}
      {s:error("no such field s")}
      {s:"baz"}
      ===
      {x:1,s:"foo"}
      {x:3,s:error("no such field s")}
      {x:3,s:"bar"}
      {x:3,s:error("no such field s")}
      {x:error("no such field x"),s:"baz"}
      ===
      {s:"foo",x:1}
      {s:error("no such field s"),x:3}
      {s:"bar",x:3}
      {s:error("no such field s"),x:3}
      {s:"baz",x:error("no such field x")}
      ===
      {y:2,w:error("no such field w")}
      {y:4,w:error("no such field w")}
      {y:4,w:error("no such field w")}
      {y:4,w:error("no such field w")}
      {y:error("no such field y"),w:{y:5}}
      ===
      error({message:"'.': applied to non-record",on:1})
      error({message:"'.': applied to non-record",on:2})
      error({message:"'.': applied to non-record",on:3})
