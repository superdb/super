script: |
  super -o test.bsup -
  super dev vector project -s test.bsup x y z
  echo ===
  super dev vector project -s test.bsup s
  echo ===
  super dev vector project -s test.bsup x s
  echo ===
  super dev vector project -s test.bsup s x
  echo ===
  super dev vector project -s test.bsup y w.y
  echo ===
  echo '1 2 3' | super -o test2.bsup -
  super dev vector project -s test2.bsup x
inputs:
  - name: stdin
    data: |
      {x:1,y:2,s:"foo"}
      {x:3,y:4}
      {x:3,y:4,s:"bar"}
      {x:3,y:4}
      {s:"baz",w:{y:5}}
outputs:
  - name: stdout
    data: |
      {x:1,y:2,z:none}
      {x:3,y:4,z:none}
      {x:3,y:4,z:none}
      {x:3,y:4,z:none}
      {x:none,y:none,z:none}
      ===
      {s:"foo"}
      {s:none}
      {s:"bar"}
      {s:none}
      {s:"baz"}
      ===
      {x:1,s:"foo"}
      {x:3,s:none}
      {x:3,s:"bar"}
      {x:3,s:none}
      {x:none,s:"baz"}
      ===
      {s:"foo",x:1}
      {s:none,x:3}
      {s:"bar",x:3}
      {s:none,x:3}
      {s:"baz",x:none}
      ===
      {y:2,w:none}
      {y:4,w:none}
      {y:4,w:none}
      {y:4,w:none}
      {y:none,w:{y:5}}
      ===
      1
      2
      3
