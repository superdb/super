script: |
  super -o d.bsup d.json
  super -o out.bsup -dynamic -c 'values commit.collection' d.bsup
  super -s out.bsup

inputs:
  - name: d.json
    data: |
      {"kind":"commit","commit":{"rev":"r1","collection":"a"}}
      {"kind":"identity","identity":{"did":"e"}}
      {"kind":"commit","commit":{"collection":"b","rev":"r2"}}

outputs:
  - name: stdout
    data: |
      "a"
      error("no such field commit")
      "b"
