# This test simply converts some SUP to BSUP then runs it through 
# the vector cache to exercise the logic that builds values from 
# cached vectors.
script: |
  super -o test.bsup -
  super dev vector copy -s test.bsup

inputs:
  - name: stdin
    data: &input |
      {a:set[1,2]}
      {a:set[3]}

outputs:
  - name: stdout
    data: *input
