script: |
  for rows in -rows=false -rows=true; do
    seq 100 | super -o t.bsup -framecap 10 -inputcap 10 $rows -I query.spq -
    echo "=== x > 51 $rows" >&2
    super -stats -f null -c "x >51" t.bsup
    echo "=== search foo18 $rows" >&2
    super -stats -f null -c "search foo18" t.bsup
    echo "=== tag='foo18' $rows" >&2
    super -stats -f null -c "tag='foo18'" t.bsup
    echo "=== count() $rows" >&2
    super -stats -f null -c "count()" t.bsup
    echo "=== values tag | this='foo18' | count() $rows" >&2
    super -stats -f null -c "values tag | this='foo18' | count()" t.bsup
  done

inputs:
  - name: query.spq
    data: |
      values {x:this,y:100-this}
      | put tag:=f"{x%2=0 ? 'foo' : 'bar'}{y}"

