script: |
  super -o out.bsup -
  super dev bsup -headers -metas -fused -s out.bsup

inputs:
  - name: stdin
    data: |
      1
      1
      1

outputs:
  - name: stdout
    data: |
      type Version={Major:uint8,Minor:uint8}
      type ColumnHeader={Version:Version,FrameSize:uint64,Root:uint32,MetadataSize:uint64,TypedefsSize:uint64,FusedTypeSize:uint64}
      {Version:{Major:0,Minor:28},FrameSize:205,Root:0,MetadataSize:162,TypedefsSize:0,FusedTypeSize:1}::ColumnHeader
      type Const={Value:any,Count:uint32}
      {Value:1::any,Count:3}::Const
      {Kind:"ColumnFrameFusedType",Type:<int64>}
      type SuperFooter={Version:Version,FooterSize:uint64,FusedTypeSize:uint64,StatsSize:uint64,SuperFrameSize:uint64}
      {Version:{Major:0,Minor:28},FooterSize:68,FusedTypeSize:1,StatsSize:21,SuperFrameSize:205}::SuperFooter
      {Kind:"SuperFrameFusedType",Type:<int64>}
