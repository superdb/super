script: |
  super -o out.bsup -
  super dev bsup -headers -metas -fused -s out.bsup

inputs:
  - name: stdin
    data: |
      1
      1
      1

outputs:
  - name: stdout
    data: |
      type Version={Major:uint8,Minor:uint16}
      type ColumnHeader={Version:Version,FrameSize:uint64,Root:uint32,FusedType:uint32,MetadataSize:uint64,TypedefsSize:uint64}
      {Version:{Major:0,Minor:29},FrameSize:184,Root:0,FusedType:8,MetadataSize:146,TypedefsSize:0}::ColumnHeader
      type Const={TypeID:uint32,Bytes:bytes,Count:uint32}
      {TypeID:8,Bytes:0x02,Count:3}::Const
      {Kind:"ColumnFrameFusedType",Type:<int64>}
      type SuperFooter={Version:Version,FooterSize:uint64,FusedTypeSize:uint64,StatsSize:uint64,SuperFrameSize:uint64}
      {Version:{Major:0,Minor:29},FooterSize:68,FusedTypeSize:1,StatsSize:21,SuperFrameSize:184}::SuperFooter
      {Kind:"SuperFrameFusedType",Type:<int64>}
