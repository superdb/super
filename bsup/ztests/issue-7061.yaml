# An option compares with an option, but comparing it with a value of its
# payload type is an error until it's unwrapped or handled with ??.

script: |
  super -o test.bsup -
  super -s -c 'from test.bsup | where unwrap(b).ok()==1'
  echo ===
  super -s -c 'from test.bsup | where b==some(1)'
  echo ===
  # the option isn't handled
  ! super -s -c 'from test.bsup | where b==1'

inputs:
  - name: stdin
    data: |
      {a:1,b?:1}
      {a:2,b?:none::int64}

outputs:
  - name: stdout
    data: |
      {a:1,b?:1}
      ===
      {a:1,b?:1}
      ===
  - name: stderr
    data: |
      option(int64): option value not handled (consider ??) at line 1, column 24:
      from test.bsup | where b==1
                             ~~~~
