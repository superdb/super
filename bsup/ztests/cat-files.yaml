script: |
  super -o a.bsup a.sup
  super -o b.bsup b.sup
  cat a.bsup b.bsup > test.bsup
  super -s test.bsup
  echo // ===
  super dev bsup -headers=false -fused -s test.bsup | super -s -c "? ColumnFrameFusedType or SuperFrameFusedType" -

inputs:
  - name: a.sup
    data: |
      {a:1}
      {b:2}
  - name: b.sup
    data: |
      {c:3}
      {d:4}

outputs:
  - name: stdout
    data: |
      {a:1}
      {b:2}
      {c:3}
      {d:4}
      // ===
      {Kind:"ColumnFrameFusedType",Type:<{a:fusion(int64|missing),b:fusion(int64|missing)}>}
      {Kind:"SuperFrameFusedType",Type:<{a:fusion(int64|missing),b:fusion(int64|missing)}>}
      {Kind:"ColumnFrameFusedType",Type:<{c:fusion(int64|missing),d:fusion(int64|missing)}>}
      {Kind:"SuperFrameFusedType",Type:<{c:fusion(int64|missing),d:fusion(int64|missing)}>}
