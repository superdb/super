script: |
  pty() {
    python3 -c 'import pty, sys; pty.spawn(sys.argv[1:])' "$@"
  }
  # Verify that pty connects standard input to a terminal.
  pty tty -s
  pty super -color=false -c 'values {a:1}'
  export SUPER_DB=test
  super db -q init
  pty super db -color=false -c 'values {b:2}'
  super db -q create p1
  pty super db ls -color=false | sed -Ee 's/[0-9a-f-]{36}/xxx/'

outputs:
  - name: stdout
    data: "{a:1}\r\n\
      {b:2}\r\n\
      p1 xxx key ts order desc\r\n"
