script: |
  export SUPER_DB=test
  super db init -q
  super db create -q test
  super db load -q -use test babble.sup
  super db -s -stats -c "from test | count()"

inputs:
  - name: babble.sup
    source: ../../../../testdata/babble.sup

outputs:
  - name: stdout
    data: |
      1000
  - name: stderr
    data: |
      {bytes_read:28646,bytes_matched:28646,records_read:1000,records_matched:1000}
