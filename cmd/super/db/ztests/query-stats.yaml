script: |
  super db init -q test
  super db attach -q test
  super db create -q test
  super db load -q -use test babble.sup
  super db -s -stats -c "from test | count()"

inputs:
  - name: babble.sup
    source: ../../../../testdata/babble.sup

outputs:
  - name: stdout
    data: |
      1000
  - name: stderr
    data: |
      {bytes_scanned:27158,values_scanned:1000,frames_scanned:1,frames_skipped_search_filter:0,frames_skipped_meta_filter:0,frames_skipped_data_filter:0,values_skipped_data_filter:0,meta_bytes_loaded:564,data_bytes_loaded:26544,type_bytes_loaded:12}
