# Small objects in a table without a sort key are packed together.

script: |
  super db init -q test
  super db attach -q test
  super db create -q test
  super db use -q test
  for i in {1..10}; do
    seq 200 | super -c '{ts:this}' - | super db load -q -
  done
  super db manage -q
  super db -s -c 'from test@main:objects | drop id,type,size'
  super db -s -c 'from test | count()'

outputs:
  - name: stdout
    data: |
      {count:2000::uint64}
      2000
